<svg viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One-Stop MCP topology: one client connects to the gateway, which routes to many downstream servers">
  <title>One-Stop MCP topology</title>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:4 6;animation:dash 1.1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f141c"/><stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a24"/><stop offset="1" stop-color="#0b1119"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="979" height="329" rx="14" fill="url(#panel)" stroke="#1e2733"/>
  <text x="16" y="22" fill="#5a6674" font-size="11" letter-spacing=".5">// live signal · client sees ~4 meta-tools, the fleet stays dormant until called</text>

  <g transform="translate(0 30)">
    <!-- client -->
    <rect x="360" y="18" width="260" height="52" rx="9" fill="#0f141c" stroke="#2a3644"/>
    <text x="490" y="41" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">AI CLIENT</text>
    <text x="490" y="58" text-anchor="middle" fill="#5a6674" font-size="10.5">Claude · Cursor · custom agent</text>

    <!-- client -> gateway -->
    <line class="flow" x1="490" y1="70" x2="490" y2="108" stroke="#22d3ee" stroke-width="2"/>
    <text x="504" y="94" fill="#5a6674" font-size="10">MCP</text>

    <!-- gateway -->
    <rect x="250" y="108" width="480" height="88" rx="11" fill="url(#gw)" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="490" y="132" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1">ONE-STOP MCP GATEWAY</text>
    <rect x="270" y="146" width="126" height="36" rx="6" fill="#0a0e14" stroke="#2a3644"/>
    <text x="333" y="168" text-anchor="middle" fill="#a78bfa" font-size="10">meta-tool facade</text>
    <rect x="408" y="146" width="120" height="36" rx="6" fill="#0a0e14" stroke="#2a3644"/>
    <text x="468" y="168" text-anchor="middle" fill="#a78bfa" font-size="10">semantic router</text>
    <rect x="540" y="146" width="170" height="36" rx="6" fill="#0a0e14" stroke="#2a3644"/>
    <text x="625" y="168" text-anchor="middle" fill="#fbbf24" font-size="10">vault · oauth broker</text>

    <!-- fan out -->
    <g stroke-width="1.5" fill="none" stroke="#22d3ee" stroke-opacity=".55">
      <path class="flow" d="M300 196 V222 H120 V244"/>
      <path class="flow" d="M400 196 V232 H305 V244"/>
      <path class="flow" d="M490 196 V244"/>
      <path class="flow" d="M580 196 V232 H675 V244"/>
      <path class="flow" d="M680 196 V222 H860 V244"/>
    </g>

    <!-- servers -->
    <g font-size="10.5" text-anchor="middle">
      <rect x="72" y="244" width="96" height="40" rx="7" fill="#0f141c" stroke="#2a3644"/><text x="120" y="269" fill="#8b98a6">GitHub</text>
      <rect x="257" y="244" width="96" height="40" rx="7" fill="#0f141c" stroke="#2a3644"/><text x="305" y="269" fill="#8b98a6">Postgres</text>
      <rect x="442" y="244" width="96" height="40" rx="7" fill="#0f141c" stroke="#2a3644"/><text x="490" y="269" fill="#8b98a6">Notion</text>
      <rect x="627" y="244" width="96" height="40" rx="7" fill="#0f141c" stroke="#2a3644"/><text x="675" y="269" fill="#8b98a6">Drive</text>
      <rect x="812" y="244" width="96" height="40" rx="7" fill="#0f141c" stroke="#22d3ee" stroke-opacity=".4"/><text x="860" y="264" fill="#22d3ee">…1000s</text><text x="860" y="277" fill="#5a6674" font-size="8.5">registered</text>
    </g>
  </g>
</svg>
