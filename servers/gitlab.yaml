# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://docs.gitlab.com/user/model_context_protocol/mcp_server/ (official, GitLab).
# Endpoint POST /api/v4/mcp over HTTP, OAuth 2.0 dynamic client registration (scope: mcp).
# Self-managed / Dedicated users replace gitlab.com with their own host. The MCP server must be
# enabled for the top-level group (GitLab.com) or instance.
id: gitlab
name: GitLab
category: [dev, code]
tags: [official, remote]
description: >
  GitLab's built-in MCP server. Read and create issues and work items, merge requests and reviews,
  inspect pipelines and job logs, browse repository files and commits, and search a GitLab instance.
homepage: https://docs.gitlab.com/user/model_context_protocol/mcp_server/
transport:
  type: streamable-http
  url: https://gitlab.com/api/v4/mcp
auth:
  type: oauth2
  scopes: [mcp]
routing:
  examples:
    - "show the merge requests waiting for my review in GitLab"
    - "create a GitLab issue for this bug"
    - "what is the status of the latest pipeline on main"
    - "read a file from my GitLab project"
  tools:
    list_merge_requests: ["list open merge requests in my gitlab project", "which MRs are waiting for my review", "show merge requests I authored that are still open"]
    get_pipeline: ["show the jobs of this gitlab pipeline", "what downstream pipelines did this run trigger", "has pipeline 1234 passed and which stage failed"]
    get_job: ["get the log of the failed gitlab CI job", "why did the test job fail", "show the status and duration of that CI job"]
    save_work_item: ["create a gitlab issue titled login page broken", "update the issue description and add the bug label", "create an epic for the Q4 onboarding work"]
    search: ["search gitlab for the word deprecated", "find merge requests containing refactor across all projects", "search the instance for a user named priya"]
    get_mcp_server_version: ["what version of the MCP server am I connected to", "which GitLab server version is this"]
    get_project: ["show details for the project at this URL", "what is the default branch and visibility of my project"]
    list_projects: ["list the projects I can access", "show projects in my group matching billing"]
    list_groups: ["list my groups and subgroups", "what subgroups exist under the platform group"]
    list_project_members: ["who has access to this project and with what role", "list the maintainers of this repo"]
    get_user: ["who am I logged in as", "look up the user with username jdoe"]
    fork_repository: ["fork this project into my namespace", "make my own copy of that repo under a different name"]
    add_branch: ["create a branch called feature/login from main", "cut a new branch off the release tag"]
    list_branches: ["list the branches in this project", "is there a branch with hotfix in its name"]
    add_commit: ["commit these file changes to the feature branch", "create, update and delete files in a single commit"]
    get_repository_file: ["show me the contents of src/app.py on main", "read the README at this ref"]
    list_repository_tree: ["list the files in the docs folder", "show the directory structure of the repo recursively"]
    get_commit: ["show the diff of commit abc123", "what changed in this commit and who made it"]
    list_commits: ["show recent commits by Sam touching the api folder", "list commits on main since last Friday"]
    list_releases: ["what releases has this project published", "list the latest releases"]
    list_tags: ["list the version tags of this repo", "find tags starting with v2"]
    get_work_item: ["open issue 42 with its comments and linked MRs", "show me the discussion on this epic"]
    list_work_items: ["list open issues assigned to me with the bug label", "search issues in the group mentioning timeout"]
    get_work_item_types: ["which work item types can I create here", "does this project support epics and tasks"]
    link_work_items: ["mark this issue as blocked by that one", "link two issues as related"]
    save_note: ["comment on this merge request saying LGTM", "reply to the discussion thread with my answer", "leave an internal note on the issue"]
    save_merge_request: ["open a merge request from my feature branch into main", "retitle the MR and assign Sam as reviewer"]
    get_merge_request: ["show MR 87 with its diff and approvals", "does this merge request have conflicts"]
    save_merge_request_review: ["approve this merge request", "leave a comment on line 40 of the diff", "resolve the review thread"]
    accept_merge_request: ["merge MR 87 now with squash", "set it to merge when the pipeline succeeds"]
    list_pipelines: ["show the latest pipelines on main", "list failed pipelines from this week"]
    save_pipeline: ["retry the failed pipeline", "cancel the running pipeline", "trigger a new pipeline on main with these variables"]
    get_artifact_file: ["read the coverage report inside the job artifacts", "open junit.xml from the build artifacts"]
    list_vulnerabilities: ["list critical security findings in this project", "show open SAST vulnerabilities"]
    get_vulnerability: ["show details for vulnerability 123", "what is the impact and fix for this security finding"]
    save_vulnerability: ["dismiss this finding as a false positive", "confirm that vulnerability and raise its severity", "open an issue for this vulnerability"]
    search_labels: ["what labels exist in this project", "find the label ids matching priority"]
    semantic_search: ["find the code that handles retry logic, by meaning", "where do we validate webhook signatures"]
health:
  check: initialize
