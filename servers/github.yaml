# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/github/github-mcp-server (official, GitHub). Remote endpoint
# https://api.githubcopilot.com/mcp/ and the Bearer-PAT header verified in its README.
# The README also says the remote server can do OAuth, but only for hosts GitHub registers;
# a generic gateway uses a fine-grained personal access token instead.
id: github
name: GitHub
category: [dev, code]
tags: [official, remote]
description: >
  GitHub's official MCP server. Browse repositories and files, read and write issues and pull
  requests, search code, inspect Actions runs and security alerts, and manage branches, releases
  and notifications.
homepage: https://github.com/github/github-mcp-server
transport:
  type: streamable-http
  url: https://api.githubcopilot.com/mcp/
auth:
  type: api_key
  header: Authorization
  prefix: "Bearer "
  keyUrl: https://github.com/settings/personal-access-tokens/new
routing:
  examples:
    - "open a pull request for my feature branch"
    - "list the open issues in my repository"
    - "search GitHub for code that uses this function"
    - "why did the CI workflow fail on this commit"
  tools:
    issue_read: ["show me issue 42 and its comments", "read the comments on issue 128", "what labels and sub-issues does this ticket have"]
    issue_write: ["file a new bug report in the repo", "close issue 57 and assign it to me", "update the title and labels on an existing issue"]
    create_pull_request: ["open a PR from my branch into main", "create a draft pull request and request reviewers", "raise a PR with this title and description from feature to develop"]
    search_code: ["find where this function is defined across GitHub", "search for files that import this library", "grep for a string across all my repos"]
    get_job_logs: ["show the failing job logs from the last workflow run", "pull the last 200 lines of logs for this CI job", "why did the build step fail in the workflow"]
    get_me: ["who am I logged in as on GitHub", "show my profile details and username"]
    search_repositories: ["find repos about vector databases written in Rust", "search GitHub for popular Go repositories with over 1000 stars"]
    get_file_contents: ["show me the contents of README.md in that repo", "read src/index.ts from the main branch", "list the files inside the docs folder"]
    get_repository_tree: ["show the full file tree of this repo", "list every folder and file in the repository recursively"]
    list_branches: ["what branches does this repo have", "list all the branches I can check out"]
    create_branch: ["create a new branch called feature/login off main", "branch off develop for my bugfix"]
    list_commits: ["show the recent commit history on main", "what were the last 10 commits on this branch"]
    get_commit: ["show me what changed in commit abc123", "get the diff and author for this commit sha"]
    search_commits: ["find commits whose message mentions the payment bug", "search commit messages by a given author in my org"]
    create_or_update_file: ["add a new file to the repo with this content", "edit config.yml on my branch and commit the change"]
    push_files: ["commit these several files to the repo in one go", "push all these changes to the branch at once"]
    delete_file: ["remove the old script from the repo and commit", "delete docs/legacy.md from the main branch"]
    create_repository: ["create a new private repository called my-app", "set up a fresh repo under my organization"]
    fork_repository: ["fork this repository to my account", "make my own copy of this open source repo"]
    list_releases: ["show all the published releases for this repo", "what versions have been released so far"]
    get_latest_release: ["what is the newest release of this repo", "get the latest release notes and version tag"]
    list_tags: ["list the git tags in this repository", "which version tags exist on the repo"]
    list_issues: ["show the open issues labeled bug", "list closed issues in the repo from last month"]
    search_issues: ["search issues mentioning a timeout error assigned to me", "find open issues across my org with the help-wanted label"]
    add_issue_comment: ["leave a comment on this pull request", "reply on issue 12 saying I'm taking it", "add a thumbs up reaction to that issue"]
    sub_issue_write: ["break this issue into smaller sub-issues", "reorder the sub-issues under the parent issue", "remove a sub-issue from the tracking issue"]
    list_pull_requests: ["show open pull requests targeting main", "list the PRs I opened that are still unmerged"]
    pull_request_read: ["show me the diff for pull request 31", "which files changed in this PR and are checks passing", "read the review comments left on the PR"]
    update_pull_request: ["change the title and description of my pull request", "retarget this PR to a different base branch", "convert the pull request back to a draft"]
    merge_pull_request: ["squash and merge pull request 45", "merge this PR into main once approved"]
    update_pull_request_branch: ["bring my PR branch up to date with main", "pull the latest base changes into my pull request branch"]
    search_pull_requests: ["find pull requests awaiting my review", "search for merged PRs that touch the auth module"]
    pull_request_review_write: ["approve this pull request with a comment", "request changes on the PR and leave feedback", "resolve the review thread on that line"]
    request_copilot_review: ["ask Copilot to review my pull request", "get an automated AI code review on this PR"]
    actions_list: ["list the recent workflow runs for this repo", "show the jobs and artifacts from the last Actions run"]
    actions_get: ["get the status of workflow run 9876", "show details for this CI job and its conclusion"]
    actions_run_trigger: ["kick off the deploy workflow on main", "re-run the failed jobs of that workflow run", "cancel the running workflow"]
    list_notifications: ["show my unread GitHub notifications", "what mentions and review requests are waiting for me"]
    list_code_scanning_alerts: ["show high severity CodeQL alerts in the repo", "list open code scanning findings for this branch"]
    list_dependabot_alerts: ["which dependencies have known vulnerabilities in this repo", "list open Dependabot security alerts"]
    list_secret_scanning_alerts: ["did anyone commit a leaked token or API key", "list the exposed secrets flagged in this repository"]
    list_gists: ["show my saved gists", "list the code snippets I've shared as gists"]
    create_gist: ["save this snippet as a new gist", "share this code as a secret gist"]
    search_users: ["find the GitHub user named octocat", "search for developers by username or location"]
    list_discussions: ["show the open discussions in this repo", "list Q&A threads in the community discussions"]
health:
  check: initialize
