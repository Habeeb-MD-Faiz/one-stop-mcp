# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/microsoft/playwright-mcp (official, Microsoft). npm @playwright/mcp,
# version pinned (npm view = 0.0.83). Snapshot = the 25 default tools (core automation + tabs).
# Opt-in capability groups (--caps=network|storage|devtools|vision|pdf|testing|config) add more
# tools and are not enabled here; add the flag to args to turn one on.
id: playwright
name: Playwright
category: [browser, testing]
tags: [official, local]
description: >
  Drive a real browser through Playwright using accessibility snapshots: navigate, click, type,
  fill forms, take screenshots, manage tabs, inspect console and network activity, and run
  JavaScript in the page.
homepage: https://github.com/microsoft/playwright-mcp
transport:
  type: stdio
  command: npx
  args: ["-y", "@playwright/mcp@0.0.83"]
auth:
  type: none
routing:
  examples:
    - "open this website in a browser and click through it"
    - "fill out and submit a web form"
    - "take a screenshot of a web page"
    - "test the login flow in the browser"
  tools:
    browser_navigate: ["go to this url", "open https://example.com in the browser", "load the staging login page"]
    browser_snapshot: ["show me what is on the page right now", "read the page structure so you can see which buttons are there", "get the accessibility tree of the current page"]
    browser_click: ["press the sign in button", "double-click the Save button", "right click the menu item in the page"]
    browser_fill_form: ["enter my details into the registration form", "fill in name, email and password fields in one go", "complete the checkout form with these details"]
    browser_take_screenshot: ["screenshot this page", "take a full page screenshot and save it as home.png", "capture an image of just the pricing section"]
    browser_navigate_back: ["go back to the previous page", "hit the browser back button"]
    browser_hover: ["hover over the Products menu to open the dropdown", "move the mouse over the tooltip icon"]
    browser_drag: ["drag the card from To Do onto the Done column", "drag this slider handle to the other element"]
    browser_drop: ["drop a file onto the upload area", "drop this image data onto the editor element"]
    browser_type: ["type my search query into the box and press enter", "type slowly into the comment field"]
    browser_press_key: ["press the Escape key", "hit Enter on the keyboard"]
    browser_select_option: ["choose Canada from the country dropdown", "select two values in the multi-select list"]
    browser_file_upload: ["attach my resume through the file chooser", "upload these two files in the open file dialog"]
    browser_handle_dialog: ["accept the confirm popup", "dismiss the alert, or type text into the prompt dialog"]
    browser_evaluate: ["run a JavaScript function on this page and return the result", "read the computed style of the header element"]
    browser_run_code_unsafe: ["run this Playwright script with page.locator and waits", "execute a multi-step Playwright code snippet end to end"]
    browser_wait_for: ["wait until the text Order confirmed appears", "pause for three seconds, then wait for the spinner to disappear"]
    browser_find: ["search the page snapshot for the text Add to cart", "regex-search the current page for an order number"]
    browser_console_messages: ["show console errors from the page", "what warnings did the page log to the console"]
    browser_network_requests: ["list the API calls the page made on load", "show failing network requests since the page loaded"]
    browser_network_request: ["show the headers and response body of request number 5", "inspect one network request in detail"]
    browser_emulate_media: ["switch the page to dark mode", "emulate reduced motion and print media"]
    browser_resize: ["resize the window to a 375 by 812 phone viewport", "make the browser 1280 pixels wide"]
    browser_tabs: ["open a new tab with this link", "list my open tabs and switch to the second one"]
    browser_close: ["close the browser page when we're done", "shut down the page"]
health:
  check: initialize
