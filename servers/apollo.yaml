# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: Apollo's hosted MCP server (official). Resource URL https://mcp.apollo.io/mcp from
#   https://mcp.apollo.io/.well-known/oauth-protected-resource ; OAuth 2.1 S256 with dynamic client registration at
#   https://mcp.apollo.io/.well-known/oauth-authorization-server (registration_endpoint .../api/v1/oauth/applications/register_oauth_client).
# NOT VERIFIED: Apollo's public docs pages returned 403/404 to WebFetch, so the vendor docs were not read.
#   Tool names and descriptions come from the tool list the live Apollo connector exposes (about 100 tools; the 38 most
#   used are in the snapshot). Many tools cost credits and carry confirmation rules in their descriptions.
id: apollo
name: Apollo.io
category: [sales, crm, marketing]
tags: [official, remote]
description: >
  Prospect and enrich people and companies in Apollo's database, manage contacts, accounts, deals,
  tasks and lists, and run email sequences and conversation lookups.
homepage: https://docs.apollo.io
transport:
  type: streamable-http
  url: https://mcp.apollo.io/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "find vp of sales at fintech companies in apollo"
    - "enrich this contact's work email"
    - "add these leads to my outreach sequence"
    - "how many apollo credits do I have left"
  tools:
    apollo_mixed_people_api_search: ["search for marketing directors in London", "find net-new prospects who are VPs of engineering at SaaS companies", "who are the heads of sales at 50 to 200 person firms using HubSpot"]
    apollo_people_match: ["get the email for this person at acme.com", "enrich this lead from their LinkedIn URL", "reveal the phone number and personal email for Jane Doe"]
    apollo_emailer_campaigns_add_contact_ids: ["enroll these contacts in my cold email sequence", "add these contacts to the Q4 outbound sequence from my work mailbox", "start emailing these leads through that sequence"]
    apollo_deals_create: ["log a new deal for the acme account", "open an opportunity for 25k closing next month in the proposal stage", "create a deal with an amount and close date under this account"]
    apollo_mixed_companies_search: ["find fintech companies with 100 to 500 employees that just raised funding", "search for companies hiring SDRs that use Salesforce"]
    apollo_organizations_lookup: ["look up this company by name without spending credits", "what is the id and domain for a company called Acme"]
    apollo_people_bulk_match: ["enrich this list of ten leads with emails in one go", "bulk match these names and domains to get contact details"]
    apollo_organizations_enrich: ["pull industry, revenue and headcount for acme.com", "enrich this company from its domain"]
    apollo_organizations_bulk_enrich: ["enrich these ten company domains in one call", "get firmographics for a batch of domains"]
    apollo_organizations_job_postings: ["what roles is this company hiring for right now", "show open job postings to see if they are growing headcount"]
    apollo_contacts_search: ["search my saved contacts for people who changed jobs recently", "find saved contacts with the label webinar-leads"]
    apollo_contacts_create: ["add Jane Smith, CTO at Globex, as a new contact", "save this lead as a contact with her email and phone"]
    apollo_contacts_update: ["change this contact's title to VP of Marketing", "update the email and company on my saved contact"]
    apollo_accounts_create: ["add Globex as a new account in our database", "save this company as an account with its domain and address"]
    apollo_accounts_update: ["update the phone number on the Globex account", "fix the domain on this saved account"]
    apollo_deals_search: ["show all open deals in my pipeline owned by me", "find deals at the negotiation stage for Acme"]
    apollo_sequences_create: ["build a four-step cold email sequence with a LinkedIn touch", "create a new outreach sequence with email and call steps"]
    apollo_emailer_campaigns_search: ["find the ID of my Q4 outbound sequence", "look up my sequences by name"]
    apollo_emailer_campaigns_approve: ["activate this sequence so contacts start getting emails", "turn on my outreach campaign now"]
    apollo_emailer_campaigns_remove_or_stop_contact_ids: ["take this lead out of all my sequences", "stop emailing the contacts who already replied"]
    apollo_emailer_messages_search: ["how many people opened and replied to my sequence emails", "show bounce and click counts for the Q4 outbound sequence", "compare the A/B subject line variants in this sequence"]
    apollo_emailer_messages_create: ["draft an email to this contact with a subject and body", "write a one-off email to Jane but don't send it yet"]
    apollo_emailer_messages_send_now: ["send the drafted email right now", "fire off that draft from my work mailbox"]
    apollo_email_accounts_index: ["which mailboxes are linked for sending", "list the email inboxes my team can send from in Apollo"]
    apollo_tasks_search: ["what tasks are due today for me", "show overdue call tasks linked to this deal"]
    apollo_tasks_create: ["remind me to call Jane next Tuesday about the proposal", "create a LinkedIn follow-up task assigned to a teammate for this contact"]
    apollo_tasks_complete: ["mark that call task as done", "complete this sequence task and move the contact to the next step"]
    apollo_phone_calls_search: ["find the calls we logged with this contact", "search recorded phone calls mentioning pricing"]
    apollo_conversations_search: ["find last week's recorded sales meetings hosted by Sam", "which conversations talked about competitors"]
    apollo_conversations_get_transcript: ["get the transcript of that recorded meeting", "pull the full call text and the linked deal"]
    apollo_labels_index: ["show all my lists and how many records each has", "which Apollo lists do we have for accounts"]
    apollo_labels_add_entity_ids_to_label_names: ["put these contacts into my Q4 prospects list", "add these accounts to a new list called target-fintech"]
    apollo_fields_index: ["what custom fields do we have on contacts", "list the custom account fields defined in our workspace"]
    apollo_webhook_result_show: ["check whether the phone reveal I requested has finished", "poll the waterfall enrichment result for this request id"]
    apollo_usage_stats_credit_usage_stats: ["how many credits do I have left this month", "when do our credits reset and how many have we used"]
    apollo_users_search: ["who are the teammates on our account", "find the user id of Sam so I can assign the deal to him"]
    apollo_users_api_profile: ["which Apollo account am I logged in as", "show my profile and whether waterfall enrichment is enabled"]
    apollo_feedback_log: ["that search came back empty, report it to Apollo", "tell Apollo this tool result was unhelpful"]
health:
  check: initialize
