# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developer.lemlist.com/mcp/setup (official, hosted by lemlist). URL https://app.lemlist.com/mcp over HTTP.
# Auth: OAuth (recommended; access token 1 h, refresh 30 days) or an API key in the X-API-Key header (Settings > Team >
#   Integrations). MCP auth discovery is assumed for OAuth. Appending ?bucket=core,prospecting... narrows advertised tools.
# NOT FULLY VERIFIED: the docs do not publish a tool list. Only these names appear in the docs (lemlist-agent.md, setup.md):
#   get_campaigns, get_campaign_stats, lemleads_search, findEmail, verifyEmail, linkedinEnrichment, findPhone, call_api.
#   Descriptions are inferred from how the docs use them and parameters are left open. Replace with a live snapshot.
id: lemlist
name: lemlist
category: [sales, marketing]
tags: [official, remote]
description: >
  Manage lemlist outreach campaigns and leads, search the B2B lead database, find and verify emails
  and phones, and read campaign statistics.
homepage: https://developer.lemlist.com/mcp/setup
transport:
  type: streamable-http
  url: https://app.lemlist.com/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "show my lemlist campaigns"
    - "find the email address for this prospect"
    - "how is my cold email campaign performing"
    - "search lemlist for founders in fintech"
  tools:
    get_campaign_stats: ["reply and open rates for the spring outreach campaign", "how many replies and clicks did my cold email sequence get", "show open rate and bounce rate for this campaign"]
    findEmail: ["find a verified email for this lead", "get the work email for Jane Doe at Acme", "find this prospect's email address using their name and company"]
    lemleads_search: ["look for heads of growth at saas companies in Berlin", "find CTOs at 50 to 200 person fintech companies in London", "build a prospect list matching my ideal customer profile"]
    get_campaigns: ["list all my active outreach campaigns", "what sequences do I already have running"]
    verifyEmail: ["check if this email address is valid before I add it", "verify the email won't bounce before sending"]
    linkedinEnrichment: ["enrich this lead from their LinkedIn profile URL", "pull job title and company details for this LinkedIn contact"]
    findPhone: ["find a phone number for this lead", "get a direct dial for the prospect"]
    call_api: ["call a lemlist API endpoint that has no dedicated tool", "hit a custom API route to add a lead to a campaign"]
health:
  check: initialize
