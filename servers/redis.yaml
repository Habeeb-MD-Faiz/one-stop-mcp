# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/redis/mcp-redis (official, Redis). PyPI redis-mcp-server, version pinned
# (PyPI = 0.5.1). README runs it as `uvx --from redis-mcp-server@latest redis-mcp-server --url ...`;
# here connection comes from the REDIS_* env vars it documents (defaults 127.0.0.1:6379 db 0), and
# the password is the injected credential (REDIS_PWD). Tool names/descriptions are from src/tools/*.py
# (the README only groups tools by data type). 45 of the 53 tools are in the snapshot (cap; left out: set_vector_in_hash, get_vector_from_hash, lrem, xdel, xgroup_destroy, scan_all_keys, create_vector_index_hash, get_indexed_keys_number).
id: redis
name: Redis
category: [database, data]
tags: [official, local]
description: >
  Read and write Redis data: strings, hashes, lists, sets, sorted sets, streams, JSON documents and
  pub/sub, scan and manage keys, run vector and hybrid searches, and inspect server stats.
homepage: https://github.com/redis/mcp-redis
transport:
  type: stdio
  command: uvx
  args: ["--from", "redis-mcp-server@0.5.1", "redis-mcp-server"]
  env:
    REDIS_HOST: "127.0.0.1"
    REDIS_PORT: "6379"
auth:
  type: api_key
  env: REDIS_PWD
routing:
  examples:
    - "get a value from redis by key"
    - "push a job onto a redis queue"
    - "how much memory is my redis server using"
    - "publish a message to a redis channel"
  tools:
    get: ["fetch the cached string stored under this key", "what value is stored at the session key", "read the string for this key"]
    scan_keys: ["find keys that start with session:", "scan the keyspace for keys matching user:*", "iterate over keys safely without blocking the server"]
    lpush: ["add an item to the front of the redis list", "push a job onto the head of the queue list", "prepend a value to the list"]
    zrange: ["show the top ten members of the leaderboard", "list sorted set members from rank 0 to 9 with scores", "get the lowest scoring members in the ranking"]
    info: ["show redis server statistics", "how much memory is the Redis instance using", "show server version, uptime and stats"]
    set: ["store this value under a key with a 60 second TTL", "save a string in Redis that expires in an hour"]
    hset: ["set the email field on the user hash", "write a field into the hash for this customer"]
    hget: ["get the status field from the order hash", "read one field of the hash stored at this key"]
    hdel: ["remove the token field from the user hash", "delete a single field out of the hash"]
    hgetall: ["show every field and value in the user hash", "dump the whole hash stored at this key"]
    hexists: ["does the hash have a field called email", "check whether this field exists in the hash"]
    json_set: ["store this JSON document at the profile key", "update the address path inside a stored JSON object"]
    json_get: ["read the nested name path from the JSON key", "fetch the JSON document saved under this key"]
    json_del: ["remove the preferences path from the stored JSON", "delete a field from the JSON document at this key"]
    rpush: ["append an item to the end of the list", "add a task to the back of the queue"]
    lpop: ["take the first element off the list", "pop the head item from the queue"]
    rpop: ["pop the last element of the list", "remove and return the final entry in the queue list"]
    lrange: ["show the first ten items in the list", "read list elements from index 0 to 20"]
    llen: ["how many items are in the list", "what is the length of this queue"]
    sadd: ["add this member to the set of online users", "put a value into the set with an expiry"]
    srem: ["remove a user id from the set", "take this member out of the set"]
    smembers: ["list everyone in the set of tags", "show all members of this set"]
    zadd: ["add a player with a score to the leaderboard", "insert a member into the sorted set with rank 42"]
    zrem: ["drop a player from the leaderboard", "remove this member from the sorted set"]
    xadd: ["append an event to the stream with these fields", "publish a log entry onto the event stream"]
    xrange: ["read the latest entries from the stream", "show the first 20 events in this stream"]
    xgroup_create: ["create a consumer group on the orders stream", "set up a new group to consume the event stream"]
    xreadgroup: ["pull new messages for my consumer in the group", "read pending stream entries as a consumer named worker-1"]
    xack: ["acknowledge the stream messages I just processed", "mark these entry ids as handled for the group"]
    publish: ["send a message to the notifications channel", "broadcast an update to all subscribers of a channel"]
    subscribe: ["listen for messages on the alerts channel", "subscribe me to a pub/sub channel"]
    psubscribe: ["subscribe to every channel matching news.*", "listen to channels by glob pattern"]
    read_messages: ["check what messages arrived on my subscription", "fetch up to 10 pending pub/sub messages"]
    unsubscribe: ["stop listening and close my subscription", "cancel the pub/sub subscription handle"]
    delete: ["delete this key from Redis", "remove the cache entry for the key"]
    type: ["what data type is stored at this key", "is this key a string, hash or list"]
    expire: ["make this key expire in 300 seconds", "set a TTL on the key"]
    rename: ["rename the key from old name to new name", "move this value to a different key name"]
    search_redis_documents: ["how do Redis streams work", "look up the Redis docs on eviction policies", "what are the use cases for sorted sets"]
    get_indexes: ["which search indexes exist in the database", "list all RediSearch indexes"]
    get_index_info: ["show the schema of the products index", "describe the fields in this search index"]
    vector_search_hash: ["find the nearest neighbours to this embedding in the index", "run a KNN similarity search over hash vectors"]
    hybrid_search: ["vector search filtered by category and price", "combine a metadata filter with embedding similarity"]
    dbsize: ["how many keys are in the database", "count the total number of keys stored"]
    client_list: ["who is connected to the Redis server right now", "list the open client connections"]
health:
  check: initialize
