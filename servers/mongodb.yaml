# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/mongodb-js/mongodb-mcp-server (official, MongoDB). npm
# mongodb-mcp-server, version pinned (npm view = 3.0.5). Connection string comes from
# MDB_MCP_CONNECTION_STRING (the injected credential). Add "--readOnly" to args to limit the server
# to read/connect/metadata tools (README), which hides the write tools listed in the snapshot.
# Snapshot = the 25 "MongoDB Database Tools" plus the knowledge-base pair; Atlas / Atlas Local tools
# need separate Atlas API credentials and are not included. The README gives names and one-line
# descriptions only: schemas are limited to database/collection, the arguments every data tool takes.
id: mongodb
name: MongoDB
category: [database, data]
tags: [official, local]
description: >
  MongoDB's official MCP server. Connect to a MongoDB deployment, run find and aggregation queries,
  insert, update and delete documents, inspect schemas, indexes and stats, and manage collections.
homepage: https://github.com/mongodb-js/mongodb-mcp-server
transport:
  type: stdio
  command: npx
  args: ["-y", "mongodb-mcp-server@3.0.5"]
auth:
  type: api_key
  env: MDB_MCP_CONNECTION_STRING
routing:
  examples:
    - "find documents in a mongodb collection"
    - "run an aggregation pipeline on my mongo database"
    - "what is the schema of this mongodb collection"
    - "add an index to a mongo collection"
  tools:
    find: ["get the latest 20 documents where status is active", "fetch users where age is over 30, sorted by signup date", "look up the order with this _id"]
    aggregate: ["group orders by customer and sum the totals", "use a $group stage to count signups per month", "run a $lookup joining orders to customers"]
    collection-schema: ["what fields do documents in this collection have", "infer the field types by sampling the collection", "show the shape of documents in events"]
    create-index: ["index the email field in users", "add a unique index on the email field", "build a compound index on user and createdAt"]
    insert-many: ["insert these records into the collection", "add an array of new user documents to the users collection", "bulk insert these JSON documents"]
    drop-database: ["drop the whole test database", "delete this database and everything in it"]
    drop-index: ["drop the index on lastName", "remove an unused index from this collection"]
    collection-indexes: ["what indexes are defined on the orders collection", "list the indexes and their keys"]
    collection-storage-size: ["how much disk space does this collection use", "what is the storage size of the logs collection"]
    db-stats: ["show the size and object counts for this database", "give me the stats on how big the database is"]
    explain: ["explain the query plan for this find", "does this query use an index or scan the whole collection"]
    export: ["export the results of this query as EJSON", "dump the aggregation output to a file"]
    mongodb-logs: ["show the latest mongod log entries", "check the server logs for recent warnings or slow queries"]
    list-knowledge-sources: ["which documentation sources can I search", "list the sources in the MongoDB knowledge base"]
    search-knowledge: ["how do I set up a TTL index, check the docs", "search the documentation for change streams in version 7"]
    connect: ["connect to my database with this mongodb+srv connection string", "open a connection to my Atlas cluster"]
    disconnect: ["close the database connection I opened", "disconnect and drop the current connection ID"]
    list-connections: ["which database connections are still open", "show my active connection IDs"]
    list-databases: ["what databases exist on this cluster", "show every database I can access"]
    list-collections: ["list the collections inside the sales database", "what collections does this database have"]
    aggregate-db: ["run a $currentOp or $listLocalSessions pipeline on the database", "run a database-level pipeline that is not tied to one collection"]
    count: ["how many documents match status equals pending", "count the records in the logs collection"]
    update-many: ["set status to archived on every document older than a year", "increment the score field for all matching documents"]
    delete-many: ["delete all documents where the session has expired", "remove every record matching this filter"]
    create-collection: ["create a new collection called invoices", "make an empty collection in the staging database"]
    rename-collection: ["rename the collection users_old to users_archive", "change the name of this collection"]
    drop-collection: ["drop the temp_import collection", "delete this collection along with its indexes"]
health:
  check: initialize
