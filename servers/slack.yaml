# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://docs.slack.dev/ai/slack-mcp-server/ (official, hosted by Slack); endpoint also in
#   https://github.com/slackapi/slack-mcp-plugin (.mcp.json).
# Tool names: slack_search_*, slack_read_*, slack_send_message*, slack_schedule_message, slack_create_canvas,
#   slack_add_reaction, slack_get_reactions from skills/slack-messaging + skills/slack-search SKILL.md in that repo;
#   slack_get_file_upload_url / slack_complete_file_upload from the docs page.
# NOT VERIFIED: exact names for the update-canvas, read-canvas and create-conversation tools (docs list them by
#   display name only), so they are omitted from the snapshot.
# Slack does NOT support dynamic client registration: it needs a registered Slack app (directory-published or
#   internal), confidential client (client_id + client_secret), user-token endpoints below. clientId per deployment.
id: slack
name: Slack
category: [communication]
tags: [official, remote]
description: >
  Search Slack messages, files, channels and users, read channel history and threads, send, draft
  and schedule messages, add reactions, and create canvases.
homepage: https://docs.slack.dev/ai/slack-mcp-server/
transport:
  type: streamable-http
  url: https://mcp.slack.com/mcp
auth:
  type: oauth2
  scopes:
    - search:read.public
    - search:read.private
    - search:read.mpim
    - search:read.im
    - search:read.files
    - search:read.users
    - channels:history
    - groups:history
    - mpim:history
    - im:history
    - chat:write
    - reactions:read
    - reactions:write
    - canvases:read
    - canvases:write
    - users:read
    - users:read.email
    - files:read
    - files:write
  authorizationUrl: https://slack.com/oauth/v2_user/authorize
  tokenUrl: https://slack.com/api/oauth.v2.user.access
routing:
  examples:
    - "post a message in the engineering channel"
    - "search slack for what we decided about the launch"
    - "catch me up on the thread in #support"
    - "schedule a reminder message for tomorrow morning"
  tools:
    slack_send_message: ["tell the team in #general that the deploy is done", "reply in the thread saying I'll take a look", "DM Sam that the report is ready"]
    slack_search_public: ["find messages about the outage in public channels", "search public channels for the pricing discussion last week", "did anyone mention the migration in a public channel"]
    slack_read_channel: ["show recent messages in the sales channel", "catch me up on what happened in #incidents overnight", "read the last 50 messages in the support channel"]
    slack_schedule_message: ["send this announcement at 9am Monday", "schedule a reminder in the standup channel for tomorrow at 9", "post this update on Friday afternoon, not now"]
    slack_search_public_and_private: ["search my DMs and private channels for what Dana said about the contract", "find that message across all my conversations including group DMs"]
    slack_search_channels: ["is there a channel for the data team", "find the channel about customer escalations"]
    slack_search_users: ["who is the person named Alex in design", "look up a teammate by their email address"]
    slack_read_thread: ["show all the replies in this thread", "open the full conversation under that message"]
    slack_read_user_profile: ["what's Priya's title and current status", "show the profile and timezone for this user ID"]
    slack_read_file: ["read the contents of the file that search turned up", "open the shared doc from that message"]
    slack_list_channel_members: ["who is in the #launch channel", "list all the members of this channel"]
    slack_send_message_draft: ["draft a message to the team but let me review before sending", "write a reply to the channel and save it as a draft"]
    slack_create_canvas: ["write up the meeting notes as a canvas and share it", "make a canvas with the project plan for the channel"]
    slack_add_reaction: ["react with a thumbs up to that message", "add a checkmark emoji to Jo's post"]
    slack_get_reactions: ["who reacted to the announcement", "which emojis are on that message"]
    slack_get_file_upload_url: ["get an upload link so I can add a PDF to a channel", "get a signed url so I can attach a file"]
    slack_complete_file_upload: ["finish the file upload and share it in #design with a note", "finalize the uploaded file and post it to the channel"]
health:
  check: initialize
