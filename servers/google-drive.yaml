# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developers.google.com/workspace/guides/configure-mcp-servers and
#   https://developers.google.com/workspace/drive/api/reference/mcp (official, hosted by Google)
# Per-tool pages: https://developers.google.com/workspace/drive/api/reference/mcp/tools_list/<tool>
# Google's docs say to create your own OAuth client (Web application) in a Google Cloud project with the
# Drive MCP service + Drive API enabled; MCP auth discovery/DCR is NOT documented, so the explicit endpoints
# below are Google's standard OAuth 2.0 endpoints. clientId is supplied per deployment.
id: google-drive
name: Google Drive
category: [productivity, docs]
tags: [official, remote]
description: >
  Search Google Drive, read file content as text, download or export files, create and copy files,
  list recent files and inspect sharing permissions.
homepage: https://developers.google.com/workspace/drive/api/reference/mcp
transport:
  type: streamable-http
  url: https://drivemcp.googleapis.com/mcp/v1
auth:
  type: oauth2
  scopes:
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/drive.file
  authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
  tokenUrl: https://oauth2.googleapis.com/token
routing:
  examples:
    - "find the budget spreadsheet in my google drive"
    - "read the contents of that google doc"
    - "upload a text file to my drive"
    - "who has access to this drive file"
  tools:
    search_files: ["search my drive for the q3 planning deck", "find spreadsheets shared with me modified this month", "look for PDFs with invoice in the title inside the Finance folder"]
    read_file_content: ["read the text of this google doc", "read this doc and include the comments", "summarize the text of that slide deck in my drive"]
    list_recent_files: ["what files did I work on recently", "show the files I opened or edited this week", "list my most recently modified drive items"]
    get_file_permissions: ["who can view this file", "who has edit access to the roadmap doc", "is this file shared publicly or only with my team"]
    get_file_metadata: ["who owns this file and when was it last edited", "show the type, size and link of this drive file"]
    download_file_content: ["export this Google Sheet as xlsx", "download the PDF from my drive as base64"]
    create_file: ["upload this markdown as a new doc in the Projects folder", "make a new folder called Receipts 2026"]
    copy_file: ["duplicate the template doc and call it Client Proposal", "make a copy of this sheet in the shared folder"]
health:
  check: initialize
