# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/pinecone-io/pinecone-mcp and https://docs.pinecone.io/guides/operations/mcp-server
# (official, by Pinecone). npm @pinecone-database/mcp 0.3.0 (npm view); needs Node 20+; API key in PINECONE_API_KEY.
# Only indexes with integrated embedding are supported. Docs list 9 tools with descriptions only, so inputSchema is open.
id: pinecone
name: Pinecone
category: [database, memory, ai]
tags: [official, local]
description: >
  Search Pinecone documentation, manage indexes, and upsert and search records using integrated
  inference with optional reranking.
homepage: https://docs.pinecone.io/guides/operations/mcp-server
transport:
  type: stdio
  command: npx
  args: ["-y", "@pinecone-database/mcp@0.3.0"]
auth:
  type: api_key
  env: PINECONE_API_KEY
  keyUrl: https://app.pinecone.io/organizations/-/keys
routing:
  examples:
    - "list my pinecone indexes"
    - "search my pinecone index for relevant records"
    - "upsert these records into pinecone"
    - "create a new vector index with integrated embeddings"
  tools:
    search-records: ["find records semantically similar to this text with a metadata filter", "query the index for passages like this question, top 10", "search a namespace by text and rerank the matches"]
    upsert-records: ["add these documents to the product index", "upsert these text records into the docs namespace", "insert or update some records with ids and metadata fields"]
    describe-index-stats: ["how many vectors are in the index", "what namespaces does the index have and how many records in each", "show the vector count and index fullness"]
    search-docs: ["how does pinecone namespaces work", "how do I choose between serverless and pod indexes", "look up the docs on metadata filtering syntax"]
    list-indexes: ["show all the vector indexes in my project", "what indexes do I have"]
    describe-index: ["show the dimension, metric and cloud region for my index", "what embedding model is configured on this index"]
    create-index-for-model: ["create an index that embeds text with multilingual-e5-large", "set up a new serverless index with integrated embeddings"]
    cascading-search: ["search my products and faq indexes together and merge the results", "query several indexes at once, dedupe, then rerank"]
    rerank-documents: ["reorder these candidate passages by relevance to my query", "rerank this list of documents with bge-reranker"]
health:
  check: initialize
