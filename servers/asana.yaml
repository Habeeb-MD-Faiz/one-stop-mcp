# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developers.asana.com/docs/using-asanas-mcp-server (official, hosted by Asana, v2). The v1 SSE
#   endpoint https://mcp.asana.com/sse shuts down 2026-05-11, so only v2 is used.
# Tools: 27 names + descriptions from https://developers.asana.com/docs/mcp-tools-reference ; parameters are not
#   documented there (tools/list is authoritative), so inputSchema is left open.
# Auth: Asana does NOT support dynamic client registration for v2. A deployment must create an "MCP app" at
#   https://app.asana.com/0/my-apps (client id + secret). Endpoints from
#   https://app.asana.com/.well-known/oauth-authorization-server ; PKCE S256; no scopes (omit the scope parameter).
id: asana
name: Asana
category: [productivity]
tags: [official, remote]
description: >
  Search and manage Asana tasks, projects, portfolios, goals and status updates, and look up users,
  teams and attachments.
homepage: https://developers.asana.com/docs/using-asanas-mcp-server
transport:
  type: streamable-http
  url: https://mcp.asana.com/v2/mcp
auth:
  type: oauth2
  scopes: []
  authorizationUrl: https://app.asana.com/-/oauth_authorize
  tokenUrl: https://app.asana.com/-/oauth_token
routing:
  examples:
    - "show my asana tasks due this week"
    - "create a task in the marketing project"
    - "post a status update on the launch project"
    - "what is the status of the q4 portfolio"
  tools:
    get_my_tasks: ["what's on my plate in asana", "show my open tasks that are due this week", "list the tasks I have already completed"]
    create_tasks: ["add three tasks to the website redesign project", "create these 10 tasks in the Sprint project and assign them to Jo", "bulk add tasks with due dates to my project"]
    update_tasks: ["mark these asana tasks complete", "reassign these tasks to Lee and push the due date a week", "change the name and due date of several tasks at once"]
    get_status_overview: ["give me a status report on the launch project", "summarise the health of every project matching onboarding", "roll up the status of all projects in my portfolio"]
    search_objects: ["find the GID of the project called Website Relaunch", "search for a person, tag or goal by name"]
    get_task: ["show everything about this task including subtasks and comments", "what are the dependencies on this task"]
    get_tasks: ["list the tasks in the Design section of my project", "show all tasks with the Urgent tag"]
    search_tasks: ["search task descriptions and comments for the word invoice", "find incomplete tasks assigned to Maria with a due date this month"]
    get_project: ["show the details and sections of the Q4 Launch project", "what is the owner and description of this project"]
    get_projects: ["list all projects for the marketing team", "include archived projects in the project list"]
    get_portfolio: ["show the portfolio called Company OKRs and its projects", "open this portfolio's details"]
    get_portfolios: ["which portfolios do I own", "list my portfolios in this workspace"]
    get_items_for_portfolio: ["what projects and goals are inside this portfolio", "list everything grouped in the Product portfolio"]
    get_attachments: ["list the files attached to this task", "show attachments on the project brief"]
    get_user: ["look up a teammate by their email", "show the profile for user me"]
    get_me: ["who am I logged in as and which workspaces do I belong to", "show my account name and email"]
    get_users: ["list everyone in my workspace", "show the people on the design team"]
    get_teams: ["which teams exist in the workspace", "list the teams I belong to"]
    get_agent: ["show the details of this AI Teammate", "look up one AI Teammate by its GID"]
    get_workspace_agents: ["list the AI Teammates in my workspace", "which AI Teammates are available here"]
    create_project: ["create a project called Product Launch with sections and starter tasks", "set up a new project for onboarding"]
    delete_task: ["delete this task and its subtasks for good", "permanently remove the duplicate task"]
    add_comment: ["comment on the task and @-mention Priya", "pin a comment on this task saying the client signed off"]
    create_project_status_update: ["post a red status update on the project explaining the delay", "write a green status update for the portfolio"]
    create_task_preview: ["draft a task for me to review before it is created", "show me a preview of the task you would make"]
    create_project_preview: ["draft a project plan with sections, tasks and assignees for me to approve", "show a preview of the whole project before creating it"]
    search_tasks_preview: ["show task search results in an interactive view", "search tasks and display them in a browsable list"]
health:
  check: initialize
