# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/Doist/todoist-ai (official, by Doist; hosted at https://ai.todoist.net/mcp,
#   Streamable HTTP, OAuth). Also runnable as npm @doist/todoist-mcp with TODOIST_API_KEY (not used here;
#   version not pinned/verified).
# Tool names: src/tools directory of that repo (verified listing). The snapshot keeps 41; omitted:
#   reorder-objects, export-project-template, import-project-template, view-attachment, search, fetch.
#   Descriptions are written from the hosted server's usage notes (the repo README does not list them) and
#   parameters are mostly left open.
id: todoist
name: Todoist
category: [productivity]
tags: [official, remote]
description: >
  Create, find, update, complete and reschedule Todoist tasks, and manage projects, sections, labels,
  comments, reminders, filters and assignments.
homepage: https://developer.todoist.com/api/v1/
transport:
  type: streamable-http
  url: https://ai.todoist.net/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "add a task to my todoist inbox"
    - "what's due today in todoist"
    - "mark the grocery task as done"
    - "create a new todoist project for the trip"
  tools:
    add-tasks: ["remind me to call the dentist tomorrow", "add a p1 task to buy milk every Monday", "create a task in my Work project due Friday at 5pm"]
    find-tasks-by-date: ["what do I have to do this week", "what is due today and what is overdue", "show everything scheduled between Monday and Sunday"]
    complete-tasks: ["check off the laundry task", "tick off the first three tasks on today's list", "mark the tax return task as done"]
    reschedule-tasks: ["push all my overdue tasks to Friday", "move my recurring standup task to tomorrow without breaking the repeat", "shift everything due today to next Monday"]
    find-tasks: ["show tasks in my Inbox labeled @waiting", "search my tasks for anything mentioning the invoice"]
    find-completed-tasks: ["what tasks did I finish last week", "list tasks I completed yesterday in the Home project"]
    update-tasks: ["change the priority of that task to p2 and rename it", "add the @errand label and move it to another section"]
    uncomplete-tasks: ["I finished that by mistake, reopen it", "bring back the task I just completed"]
    add-projects: ["create a new project called Home Renovation", "make a project for the Q4 launch with a blue color"]
    find-projects: ["list all my projects", "which of my projects match the word marketing"]
    update-projects: ["rename my Errands project and mark it as a favorite", "switch the project view to board layout"]
    project-management: ["archive the finished Website Redesign project", "unarchive an old project so I can use it again"]
    project-move: ["move my personal project into the team workspace", "take this workspace project back to my personal projects"]
    add-sections: ["add a Backlog and a Doing section to this project", "create a new column named Review in the project"]
    find-sections: ["what sections are in my Sprint project", "list the columns of this project"]
    update-sections: ["rename the Doing section to In Progress", "change the name of that section"]
    add-labels: ["create a new label called @deepwork", "add a personal label for @phone calls"]
    find-labels: ["show all my labels", "do I already have a label named waiting"]
    update-labels: ["rename the @home label to @house", "change the color of my errand label"]
    add-comments: ["leave a note on this task and notify Priya", "comment on the project with the meeting summary"]
    find-comments: ["what comments are on the budget task", "show the discussion on this project"]
    update-comments: ["fix the typo in my last comment", "edit the comment I wrote on that task"]
    add-reminders: ["remind me 30 minutes before this task is due", "set a location reminder for when I arrive at the store"]
    find-reminders: ["what reminders are set on this task", "list the alerts I scheduled for my tasks"]
    update-reminders: ["move the reminder to an hour earlier", "change that reminder to trigger at home instead"]
    add-filters: ["save a filter for p1 tasks due this week", "create a custom filter for @waiting items in Work"]
    find-filters: ["list my saved filters", "which custom filters do I have"]
    update-filters: ["change the query of my Today filter", "rename a saved filter and update its color"]
    manage-assignments: ["assign these tasks to Sam in the shared project", "unassign me from all tasks in this project"]
    find-project-collaborators: ["who is on the shared Marketing project", "look up the user id for jane@example.com"]
    find-activity: ["what did I complete last week", "show who edited tasks in this project yesterday"]
    get-overview: ["give me a summary of my workload and projects", "how am I doing across my projects right now"]
    get-productivity-stats: ["what's my karma and current streak", "how many tasks have I completed this week"]
    get-project-health: ["is my launch project on track", "what is the health status of this project"]
    analyze-project-health: ["refresh the health check for this project", "re-run the analysis on how the project is going"]
    get-project-activity-stats: ["how active has this project been lately", "show activity counts for the project over time"]
    get-workspace-insights: ["give me insights across all projects in the workspace", "which team projects are falling behind"]
    list-workspaces: ["which Todoist workspaces am I a member of", "list my team workspaces"]
    user-info: ["what is my user id and timezone", "show my account name and email"]
    fetch-object: ["open task 8123 along with its subtasks", "get the full details of this project by id"]
    delete-object: ["delete this task permanently", "remove that label, filter or comment by id"]
health:
  check: initialize
