# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/tsmztech/mcp-server-salesforce (community, MIT), npm @tsmztech/mcp-server-salesforce 0.0.8.
# Why community: Salesforce's own local server @salesforce/mcp is a developer-tooling server (metadata, Apex tests, one
#   SOQL tool) and reaches end of life on 2026-11-02 (https://github.com/forcedotcom/mcp/issues/46). The hosted
#   Salesforce MCP docs (developer.salesforce.com) returned 403 to WebFetch, so no hosted endpoint could be verified.
# Auth: the package supports SALESFORCE_CONNECTION_TYPE = User_Password | OAuth_2.0_Client_Credentials | Salesforce_CLI |
#   Access_Token. This manifest uses Access_Token: the gateway's OAuth flow supplies SALESFORCE_ACCESS_TOKEN. A deployment
#   must also set SALESFORCE_INSTANCE_URL (from the token response / org My Domain) and provide a Connected App client id.
#   NOT VERIFIED: the Salesforce authorize/token URLs below are the standard login.salesforce.com OAuth endpoints; use
#   test.salesforce.com for sandboxes or the org's My Domain.
id: salesforce
name: Salesforce
category: [crm, sales]
tags: [community, local]
description: >
  Query and modify Salesforce records with SOQL and SOSL, describe objects and fields, and manage
  custom objects, fields, Apex classes and triggers.
homepage: https://github.com/tsmztech/mcp-server-salesforce
transport:
  type: stdio
  command: npx
  args: ["-y", "@tsmztech/mcp-server-salesforce@0.0.8"]
  env:
    SALESFORCE_CONNECTION_TYPE: Access_Token
auth:
  type: oauth2
  env: SALESFORCE_ACCESS_TOKEN
  scopes: [api, refresh_token]
  authorizationUrl: https://login.salesforce.com/services/oauth2/authorize
  tokenUrl: https://login.salesforce.com/services/oauth2/token
routing:
  examples:
    - "query my salesforce opportunities"
    - "update the stage of this salesforce deal"
    - "describe the fields on the account object"
    - "create a new lead in salesforce"
  tools:
    salesforce_query_records: ["list open opportunities over fifty thousand", "pull all contacts at Acme with their open cases", "run a SOQL query for leads created this month"]
    salesforce_dml_records: ["insert a new contact record", "update the stage on this opportunity to Closed Won", "upsert these accounts by external ID"]
    salesforce_describe_object: ["what fields does the case object have", "show the picklist values for opportunity stage", "which relationships does the account object have"]
    salesforce_aggregate_query: ["sum of closed won amount grouped by owner", "count opportunities by stage for this quarter", "average deal size per sales rep with a minimum of five deals"]
    salesforce_search_objects: ["is there a custom object with invoice in its name", "find objects whose name contains Subscription"]
    salesforce_search_all: ["search every object for the name Johnson", "run a SOSL search across accounts and contacts for this email"]
    salesforce_manage_object: ["create a custom object called Project__c", "change the sharing model on my custom object"]
    salesforce_manage_field: ["add a currency field to the Opportunity object", "create a lookup relationship from Contract__c to Account"]
    salesforce_manage_field_permissions: ["give the Sales profile read access to the discount field", "who can edit this field, show the field-level security"]
    salesforce_read_apex: ["show me the source of the AccountService Apex class", "list the Apex classes with Handler in the name"]
    salesforce_write_apex: ["create an Apex class that validates lead emails", "update the OrderHelper class to the latest API version"]
    salesforce_read_apex_trigger: ["show the code of the OpportunityTrigger", "list all the triggers on the Case object"]
    salesforce_write_apex_trigger: ["write a before-insert trigger on Account", "add an after update event to the contact trigger"]
    salesforce_execute_anonymous: ["run this snippet of anonymous Apex in the org", "execute some Apex and show me the debug output"]
    salesforce_manage_debug_logs: ["turn on debug logging for my user", "fetch the latest debug logs for the integration user"]
health:
  check: initialize
