# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://supabase.com/mcp and https://github.com/supabase-community/supabase-mcp (official,
# Supabase). Hosted endpoint https://mcp.supabase.com/mcp; default auth is browser OAuth, a scoped
# personal access token as `Authorization: Bearer` is documented for CI. Optional URL params:
# project_ref=<id> (scope to one project, disables account tools), read_only=true, features=<groups>.
# The 27 tools below are the default feature groups (account, database, debugging, development,
# docs, functions, branching); storage tools are off by default and omitted.
# supabase.com/mcp lists names and descriptions only. Only get_project_url(project_id) was checked
# against the README; the other argument names (project_id, query, name, function_slug, branch_id,
# graphql_query ...) follow the project's conventions and are NOT individually verified.
id: supabase
name: Supabase
category: [database, dev]
tags: [official, remote]
description: >
  Supabase's hosted MCP server. Manage projects and branches, inspect tables and run SQL, apply
  migrations, read logs and advisors, deploy Edge Functions, generate TypeScript types and search
  the docs.
homepage: https://supabase.com/mcp
transport:
  type: streamable-http
  url: https://mcp.supabase.com/mcp
auth:
  type: oauth2
routing:
  examples:
    - "run a SQL query on my supabase project"
    - "apply a database migration to supabase"
    - "list the tables in my supabase database"
    - "deploy an edge function to supabase"
  tools:
    execute_sql: ["run this select against the supabase postgres", "select the 10 newest rows from the users table", "run an insert on my postgres and return the result"]
    apply_migration: ["add a column to the table through a migration", "create a table for orders via a named migration", "alter the profiles table with a new column and record it as a migration"]
    get_advisors: ["are there security warnings on my supabase project", "do I have tables without row level security", "check my project for missing indexes and performance issues"]
    generate_typescript_types: ["generate types for my database schema", "generate TypeScript types from my tables and views", "update my database.types.ts from the schema"]
    deploy_edge_function: ["publish this function to supabase", "deploy my new webhook handler as an edge function", "publish this index.ts as a function named stripe-hook"]
    list_organizations: ["which organizations am I a member of", "list the organizations tied to my Supabase login"]
    get_organization: ["what subscription plan is my organization on", "show the details of this org"]
    list_projects: ["list all my projects", "which projects do I have access to"]
    get_project: ["show the status and region of this project", "get the details of my staging project"]
    create_project: ["spin up a new project in the Singapore region", "create a project under my organization called prod-api"]
    pause_project: ["pause my idle project to save cost", "temporarily shut down this unused project"]
    restore_project: ["bring my paused project back up", "restore the project I paused last month"]
    list_tables: ["what tables are in the public schema", "list the tables and their columns in my database"]
    list_extensions: ["is pgvector installed on this database", "which Postgres extensions are available or enabled"]
    list_migrations: ["which migrations have been applied so far", "show the migration history for this database"]
    query_logs: ["show auth service errors from the last hour", "query the edge function and API logs for failed requests"]
    get_project_url: ["what is my project's API URL", "give me the base URL for my project"]
    get_publishable_keys: ["get my anon and publishable API keys", "what key do I use in the client SDK"]
    list_edge_functions: ["which edge functions are deployed to this project", "show every function I have deployed in the project"]
    get_edge_function: ["show me the source of the edge function called send-email", "get the code for a deployed function"]
    search_docs: ["how do I set up row level security policies, check the docs", "look up the docs on storage buckets and signed URLs"]
    create_branch: ["create a development branch to test my schema change", "make a preview branch off production"]
    list_branches: ["what development branches exist for this project", "show my preview branches"]
    delete_branch: ["delete the dev branch I no longer need", "remove this development branch"]
    merge_branch: ["merge my dev branch into production", "promote the branch migrations and functions to prod"]
    reset_branch: ["reset my branch back to an earlier migration", "roll the development branch back to a previous migration version"]
    rebase_branch: ["rebase my branch on production to pick up new migrations", "my branch is behind prod, bring it up to date"]
health:
  check: initialize
