# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developers.hubspot.com/docs/apps/developer-platform/build-apps/integrate-with-hubspot-mcp-server
#   (official, hosted by HubSpot). Server https://mcp.hubspot.com , Streamable HTTP, OAuth 2.1 with PKCE (S256).
# Tools: 32 names + descriptions from that page (parameter schemas are not published; a few constraints are noted).
# Auth: a deployment must create an MCP connector in HubSpot (Development > MCP Connectors) to get a client id/secret and
#   register the redirect URL. Scopes follow the tools and the user's permissions, so none are listed.
# NOT VERIFIED: dynamic client registration and explicit authorize/token URLs are not documented; MCP auth discovery assumed.
id: hubspot
name: HubSpot
category: [crm, marketing, sales]
tags: [official, remote]
description: >
  Search and manage HubSpot CRM records (contacts, companies, deals, tickets), activities, segments
  and properties, and read marketing campaign, email, content and conversation data.
homepage: https://developers.hubspot.com/mcp
transport:
  type: streamable-http
  url: https://mcp.hubspot.com
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "find the deal for acme in hubspot"
    - "create a new contact in my crm"
    - "log a note on this company record"
    - "how are our marketing emails performing"
  tools:
    search_crm_objects: ["show contacts created this month in hubspot", "find all companies in Germany with more than 200 employees", "look up the ticket about the billing error"]
    manage_crm_objects: ["update the stage of this deal", "create a new contact for Jane Doe at Acme", "log a call note on this company record"]
    query_crm_data: ["total closed won revenue by owner this quarter", "count open deals per pipeline stage", "average deal size by industry this year"]
    get_marketing_email_analytics: ["open rates for last week's newsletter", "how is deliverability for our marketing emails this month", "show click and bounce rates for the last 30 days"]
    get_user_details: ["which HubSpot account am I connected as", "check my read and write access for each object"]
    get_organization_details: ["what are our account timezone and currency", "how many seats and teams do we have"]
    discover_hubspot_schema: ["which CRM object types exist in my account", "do we have a custom object for subscriptions"]
    get_crm_objects: ["fetch these 50 deals by id", "get the full records for these contact ids"]
    manage_segment: ["create a segment of contacts who attended the webinar", "add these contacts to my static list"]
    search_properties: ["what property stores the lead source", "find properties related to renewal date"]
    get_properties: ["show the dropdown values for the lifecycle stage property", "what data type is this contact property"]
    manage_custom_properties: ["add a custom property called contract_end_date to deals", "create a dropdown field for customer tier on companies"]
    manage_custom_pipelines: ["set up a new deal pipeline for partnerships", "create a support ticket pipeline with these stages"]
    search_owners: ["who is the owner called Maria", "find the owner id for sam@company.com"]
    get_campaign_attribution_reports: ["how much closed-won revenue did the spring campaign drive", "which campaigns influenced our won deals"]
    read_campaign_data: ["show the analytics for my product launch campaign", "which assets performed best in this campaign"]
    manage_campaign_objects: ["create a campaign called Fall Webinar", "attach this landing page to the campaign"]
    search_conversations: ["find chats mentioning refund from last week", "show conversation counts per inbox and channel"]
    get_conversation_channel_metadata: ["list my inboxes and chat channels", "which channels are connected to the shared inbox"]
    search_intent_signals: ["which companies are showing buying intent this week", "count intent signals by company"]
    manage_marketing_email: ["draft a new marketing email from my newsletter template", "clone last month's email and edit the subject line", "set up an A/B variant for this email"]
    get_content_analytics_report: ["how many views did our blog posts get last quarter", "show landing page traffic over time"]
    manage_landing_page: ["create a landing page for the webinar and publish it", "clone the pricing landing page"]
    manage_website_page: ["edit the About page and publish it", "update the main navigation menu on our website"]
    manage_blog_post: ["write a draft blog post on product updates", "publish the blog post I drafted yesterday", "list my blog posts tagged case-study"]
    render_asset: ["show me a preview card of this landing page", "preview that blog post"]
    get_aeo_metrics: ["what is our share of voice in AI answers", "how do we compare with competitors in answer engines"]
    manage_aeo_prompts: ["which tracked prompts perform best for our brand", "start tracking the prompt best CRM for startups"]
    manage_aeo_recommendations: ["show recommendations for improving our brand visibility in AI answers", "turn this recommendation into a blog post"]
    manage_onboarding: ["where am I in setting up the CRM", "walk me through my onboarding goals and tasks"]
    tool_guidance: ["how do I use the query_crm_data tool", "give me instructions for the campaign tools"]
    submit_feedback: ["send feedback about the HubSpot MCP server", "let the vendor know the CRM search is slow"]
health:
  check: initialize
