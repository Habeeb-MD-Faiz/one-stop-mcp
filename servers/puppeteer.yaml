# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/puppeteer
# (reference; moved to servers-archived and the npm package is no longer released, last 2025.5.12).
# npm @modelcontextprotocol/server-puppeteer, version pinned. The README shows no deprecation
# notice. Opens a visible browser unless PUPPETEER_LAUNCH_OPTIONS sets headless (README); launch
# options that weaken security also need ALLOW_DANGEROUS=true.
# Prefer the `playwright` server for new work; this entry exists because PDR section 7 lists it.
id: puppeteer
name: Puppeteer
category: [browser, testing]
tags: [reference, local]
description: >
  Drive a Chrome browser with Puppeteer: navigate to pages, click, fill and select form fields,
  take screenshots and run JavaScript in the page.
homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/puppeteer
transport:
  type: stdio
  command: npx
  args: ["-y", "@modelcontextprotocol/server-puppeteer@2025.5.12"]
auth:
  type: none
routing:
  examples:
    - "open a website in a browser and take a screenshot"
    - "click the login button on the page"
    - "fill in the form fields on a web page"
    - "run javascript in the browser tab"
  tools:
    puppeteer_navigate: ["go to this url in a headless browser", "launch Chrome and load this page, allowing custom launch options", "open the site with puppeteer in a headless Chrome"]
    puppeteer_screenshot: ["capture a screenshot of the page", "screenshot the #hero element at 1200 by 800", "save a named screenshot of the whole page"]
    puppeteer_click: ["press the submit button", "click the element matching the .checkout-btn selector", "click the first link with this CSS selector"]
    puppeteer_fill: ["type my email into the input box", "fill the input[name=email] selector with my address", "enter a value into the search field by selector"]
    puppeteer_evaluate: ["execute this script in the page context", "run document.title in the browser console", "evaluate a JavaScript snippet and return its value"]
    puppeteer_hover: ["hover over the #nav-products selector", "move the pointer over the element matching this CSS selector"]
    puppeteer_select: ["pick Medium in the select#size dropdown", "choose an option in the SELECT element with this selector"]
health:
  check: initialize
