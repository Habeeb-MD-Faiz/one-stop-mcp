# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://vercel.com/docs/agent-resources/vercel-mcp (official, Vercel). Remote MCP with
# OAuth at https://mcp.vercel.com (MCP Authorization + Streamable HTTP). Vercel only allows
# clients it has reviewed and approved (its supported-clients list); a gateway may need that
# approval before the OAuth step works - UNVERIFIED for this gateway.
# The server has ~210 tools in 28 categories (docs tools reference); the snapshot is a curated 32:
# deployments, projects, docs, observability, environment variables and teams. Tool names,
# descriptions and parameters come from the per-category reference pages (parameters trimmed to the
# common ones; most tools also take teamId/slug). Out of the snapshot: domains/DNS, sandboxes,
# firewall, feature flags, rolling releases, routing, billing, storage and the rest.
id: vercel
name: Vercel
category: [cloud, dev]
tags: [official, remote]
description: >
  Vercel's official MCP server. Search Vercel docs, manage teams, projects and deployments, read
  build and runtime logs and errors, and manage project environment variables.
homepage: https://vercel.com/docs/agent-resources/vercel-mcp
transport:
  type: streamable-http
  url: https://mcp.vercel.com
auth:
  type: oauth2
routing:
  examples:
    - "show my latest Vercel deployment"
    - "why is my Vercel production build failing"
    - "list my projects on Vercel"
    - "add an environment variable to my Vercel project"
  tools:
    list_deployments: ["list the deployments of my blog project", "show my recent preview deployments for the main branch", "which deployments are currently in a failed state"]
    get_deployment: ["get details about my latest production deployment", "look up the deployment behind this vercel.app URL", "is my latest deployment ready or still building"]
    get_runtime_logs: ["show me the runtime error logs from the last hour", "show 500 errors from my production function logs", "search the runtime logs for a specific error message"]
    list_deployment_events: ["show the build logs for the failed deployment", "why did my last build fail, show the build output", "show the build events for this deployment"]
    search_vercel_documentation: ["how do I configure custom domains on vercel", "search the docs for edge function limits", "what do the docs say about ISR and revalidation"]
    list_teams: ["which Vercel teams am I a member of", "show the teams I can switch to"]
    list_projects: ["list all the projects in my Vercel account", "find the project linked to my portfolio repo"]
    get_project: ["show the settings and framework config for my web project", "what build command does this project use"]
    create_project: ["create a new Vercel project for my app", "set up a fresh project under my team"]
    create_git_project: ["import my GitHub repo as a new project and deploy a preview", "link this Git repository to a project on Vercel"]
    update_project: ["change the build command and output directory of my project", "switch my project's Node.js version and root directory"]
    pause_project: ["pause my project so it stops serving traffic", "temporarily take this project offline"]
    unpause_project: ["resume my paused project", "bring the paused project back online"]
    add_project_domain: ["attach my custom domain to this project", "add www.mysite.com as a domain for my app"]
    list_project_domains: ["which domains are assigned to my project", "show unverified domains on this project"]
    create_deployment: ["deploy my project to production", "trigger a new preview deployment from my feature branch"]
    cancel_deployment: ["cancel the deployment that is currently building", "stop this stuck build before it finishes"]
    list_deployment_files: ["list the files that were uploaded in this deployment", "show the file tree of my deployment"]
    get_deployment_file_contents: ["open one source file from this deployment", "show me the contents of index.html as deployed"]
    get_git_deployment_context: ["show my teams, plans and connected Git projects", "what repos and workspaces are linked to my account"]
    get_access_to_vercel_url: ["give me a shareable link to my password-protected preview", "create a temporary access link for this protected deployment"]
    web_fetch_vercel_url: ["fetch the page at my preview URL behind authentication", "read the response from this protected deployment URL"]
    get_runtime_errors: ["group my production runtime errors and show which routes fail most", "what errors started appearing after the last deploy"]
    get_project_trace: ["pull up the trace for this request ID", "show the trace of one slow request in my project"]
    create_observability_query: ["query my observability data for p95 latency by route", "count requests per route over the last day"]
    get_observability_schema: ["what fields and metrics can I query in observability", "show the schema for observability queries"]
    filter_project_envs: ["list the environment variables set on my project", "show the env vars used on a specific git branch"]
    get_project_env: ["reveal the decrypted value of one project env var", "what is the value of my DATABASE_URL variable"]
    create_project_env: ["add an API key as an environment variable to my project", "set several env vars for production and preview at once"]
    edit_project_env: ["change the value of an existing environment variable", "update the target environments of this env var"]
    list_project_custom_environments: ["show the custom environments such as staging on my project", "list non-default environments for this project"]
    update_shared_env_variable: ["update a team-wide shared environment variable", "change a shared env var used across all my projects"]
health:
  check: initialize
