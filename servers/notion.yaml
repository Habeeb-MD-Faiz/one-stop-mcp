# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developers.notion.com/guides/mcp/get-started-with-mcp (official, hosted by Notion)
# Tool list: https://developers.notion.com/guides/mcp/mcp-supported-tools (36 tools, snapshot taken from docs).
# OAuth discovery + dynamic client registration verified at https://developers.notion.com/guides/mcp/build-mcp-client
id: notion
name: Notion
category: [productivity, docs]
tags: [official, remote]
description: >
  Search, read, create and edit Notion pages, databases, views and comments in the
  connected workspace, query data sources, and manage files and Custom Agent sessions.
homepage: https://developers.notion.com/guides/mcp/get-started-with-mcp
transport:
  type: streamable-http
  url: https://mcp.notion.com/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "find my meeting notes in notion"
    - "create a new page in my notion workspace"
    - "add a row to my notion database"
    - "what does our notion wiki say about onboarding"
  tools:
    notion-search: ["search my workspace for the onboarding doc", "find the page about our Q3 roadmap", "look up a teammate by email in the workspace"]
    notion-fetch: ["open this notion page and read it", "pull up the contents of this database view", "get the text of the page behind this link"]
    notion-create-pages: ["write a new project brief page in notion", "make a meeting notes page under the team wiki with these bullets", "add a new page to the projects database with these properties"]
    notion-update-page: ["edit the status property on that notion page", "change the title and cover image of this page", "replace the second paragraph in that page"]
    notion-query-data-sources: ["list all tasks in my tracker database due this week", "count the tasks per assignee with SQL", "run the saved view of my sprint board"]
    notion-move-pages: ["move this page under the engineering teamspace", "relocate these databases into another parent page"]
    notion-duplicate-page: ["make a copy of my weekly template page", "duplicate this page within the workspace"]
    notion-create-database: ["create a database to track customer feedback with status and owner columns", "set up a new table with a board view"]
    notion-update-data-source: ["rename this data source and update its description", "add a Priority select property to the database"]
    notion-create-view: ["add a board view grouped by status", "make a calendar view filtered to my tasks"]
    notion-update-view: ["change the filter on this view to show only open items", "sort the view by due date and rename it"]
    notion-create-folder: ["create an empty folder for archived projects", "add a folder under this page to organize docs"]
    notion-query-meeting-notes: ["summarize my meeting notes from last week", "find the meeting where we discussed the pricing change"]
    notion-create-comment: ["leave a comment on this page asking for review", "reply to the discussion thread on that paragraph"]
    notion-get-comments: ["show me the comments on this page", "what feedback did people leave in the discussion threads"]
    notion-get-users: ["who are the members and guests in the workspace", "find the user with email sam@example.com"]
    notion-get-teams: ["list the teamspaces in our workspace", "which teamspaces can I see"]
    notion-get-self: ["which workspace am I connected to", "who is the current user for this connection"]
    notion-get-tool-access: ["which tools does our plan allow", "check whether my plan lets me query meeting notes"]
    notion-create-file-upload: ["get an upload URL so I can send a local file", "upload a 10 MB PDF from my laptop"]
    notion-create-attachment: ["attach this text snippet as a file on the page", "add the file at this https link as an attachment", "finish attaching the file I just uploaded"]
    notion-download-attachment: ["download the text of this attachment", "read the contents of the attached file"]
    notion-convert-page-to-skill: ["turn this page into a reusable skill", "mark this page as a skill"]
    notion-download-skill: ["download that skill as a tar.gz with its files", "export my skill and its supporting files"]
    notion-get-async-task: ["is the page duplication finished yet", "check the status of task id 123"]
    notion-list-agents: ["which custom agents do I have", "list the available agents in the workspace"]
    notion-search-agents: ["find the URL of the support triage agent", "look up an agent by name so I can start a session"]
    notion-query-sessions: ["list my recent agent sessions", "show the running sessions of my custom agents"]
    notion-search-sessions: ["find the session where the agent drafted the changelog", "search agent sessions that mention invoices"]
    notion-spawn-session: ["start a session with the weekly report agent", "kick off my custom agent with this prompt"]
    notion-get-session-status: ["is that agent session still running", "check the status of session abc"]
    notion-wait-session: ["wait until the agent finishes its current run", "block until that session is done"]
    notion-send-message-to-session: ["tell the agent to also include last month's numbers", "send a follow-up message to the running session"]
    notion-stop-session: ["stop the agent that is running away", "cancel the current run of that session"]
    notion-list-session-events: ["show what the agent did step by step in this session", "list the events of the session"]
    notion-read-session-event: ["open event 3 of that session in full", "read the details of one session event"]
health:
  check: initialize
