# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developer.clickup.com/docs/connect-an-ai-assistant-to-clickups-mcp-server (official, hosted by
#   ClickUp). OAuth only ("We only support OAuth", OAuth 2.1 with PKCE); API keys are not accepted.
# Tools: https://developer.clickup.com/docs/mcp-tools lists display names only. Tool identifiers and descriptions
#   in catalog/clickup.json come from the tool list the live ClickUp connector (mcp.clickup.com/mcp) exposes
#   (31 of ~70 included). NOT VERIFIED: whether dynamic client registration is offered; discovery is assumed.
id: clickup
name: ClickUp
category: [productivity]
tags: [official, remote]
description: >
  Search, create, update and organise ClickUp tasks, lists, folders, docs and chat, track time, and
  manage comments, tags, dependencies and custom fields.
homepage: https://developer.clickup.com/docs/connect-an-ai-assistant-to-clickups-mcp-server
transport:
  type: streamable-http
  url: https://mcp.clickup.com/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "create a task in my clickup sprint list"
    - "what tasks are due this week in clickup"
    - "start a timer on the redesign task"
    - "add a comment to the clickup ticket"
  tools:
    clickup_create_task: ["add a task called fix invoices to the finance list", "create a task for the homepage redesign due Friday, assigned to Sam", "add a high priority task to my sprint list with a subtask"]
    clickup_filter_tasks: ["show high priority tasks assigned to me", "list overdue tasks in the Engineering space with status in review", "tasks tagged bug that were completed last week"]
    clickup_start_time_tracking: ["track my time on this task", "start a billable timer on the invoice task", "begin tracking time against this ticket"]
    clickup_update_task: ["mark that clickup task as complete", "change the due date of that task to next Monday", "set the task status to in progress and reassign it to me"]
    clickup_search: ["search my workspace for anything mentioning the Q3 roadmap", "find the doc or chat where we discussed pricing"]
    clickup_get_task: ["open task DEV-1234 and show its details", "what is the status and description of this task"]
    clickup_delete_task: ["delete the duplicate task I just created", "remove this task permanently from the list"]
    clickup_move_task: ["move this task to the Backlog list", "shift the task into a different list"]
    clickup_add_tag_to_task: ["tag this task as urgent", "apply the existing frontend tag to my task"]
    clickup_add_task_dependency: ["mark this task as waiting on the design review", "make task A block task B"]
    clickup_attach_task_file: ["attach this PDF to the task", "upload a screenshot from this URL onto the task"]
    clickup_create_comment: ["leave a comment on the task saying the client approved", "post a note on this task for the team"]
    clickup_get_task_comments: ["show the comments on this task", "read the discussion thread under task DEV-88"]
    clickup_get_workspace_hierarchy: ["show my spaces, folders and lists", "map out how my workspace is organised"]
    clickup_get_list: ["look up the list called Sprint 14 and its statuses", "what statuses does the Content Calendar list use"]
    clickup_create_list: ["create a new list called Launch Checklist in the Marketing space", "add a list to my Product space"]
    clickup_create_folder: ["create a folder for Q4 campaigns in the Marketing space", "add a new folder to my space"]
    clickup_get_custom_fields: ["what custom fields exist on the Bugs list", "show the dropdown options for the Severity field"]
    clickup_stop_time_tracking: ["stop the timer I started earlier", "end the running time tracker and save the entry"]
    clickup_add_time_entry: ["log 2 hours yesterday on the onboarding task", "add a manual time entry of 45 minutes to this task"]
    clickup_get_time_entries: ["how many hours did I log this week", "show billable time entries for the client project last month"]
    clickup_get_current_time_entry: ["is a timer running right now", "which task am I currently tracking time on"]
    clickup_get_workspace_members: ["who is on my ClickUp team", "list everyone in the workspace"]
    clickup_find_member_by_name: ["find the teammate whose email is priya@acme.com", "look up Dana in the workspace by name"]
    clickup_resolve_assignees: ["turn these names and me into user IDs for assigning tasks", "get the numeric user IDs for these teammates"]
    clickup_create_document: ["create a new Doc for the meeting notes in the Product space", "start a document called Onboarding Guide in this folder"]
    clickup_get_document_pages: ["read the content of this Doc page", "fetch the pages of the Q4 planning doc"]
    clickup_update_document_page: ["append today's notes to the end of this doc page", "rewrite the intro of the Doc page"]
    clickup_get_chat_channels: ["list my chat channels", "which channels exist in the workspace chat"]
    clickup_send_chat_message: ["post an update in the #launch channel", "reply in the thread of that chat message"]
    clickup_create_reminder: ["remind me tomorrow at 9am to send the invoice", "set a personal reminder for Friday afternoon"]
health:
  check: initialize
