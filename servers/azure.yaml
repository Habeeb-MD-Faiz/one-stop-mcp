# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/microsoft/mcp (servers/Azure.Mcp.Server, official, Microsoft) and
# https://learn.microsoft.com/en-us/azure/developer/azure-mcp-server/tools/. npm @azure/mcp, whose
# latest tag is a beta (npm view = 3.0.0-beta.50); pinned to it. Command from the README:
# `npx -y @azure/mcp@latest server start`. Auth is the developer's own Azure identity (az login /
# managed identity; Docker setups use AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET), so
# no credential is injected by the gateway. The stdio child must be able to see the Azure CLI
# profile (HOME/USERPROFILE, see D31). The docs list a "read only" start option but name no CLI
# flag, so none is passed.
# UNVERIFIED: in the default `namespace` mode the server exposes one tool per service namespace.
# The docs' "Namespace" column (storage, keyvault, group, ...) is used here as the tool name and its
# description as the tool description; the exact registered names and each tool's input schema were
# not published on the pages read. Individual tools (azmcp_storage_account_get ...) are exposed in
# `all` mode or via the Tool option. Re-snapshot from a live tools/list when possible.
id: azure
name: Microsoft Azure
category: [cloud, infra]
tags: [official, local]
description: >
  Microsoft's Azure MCP server. Work with Azure resources by service: subscriptions and resource
  groups, storage, Key Vault, App Service, AKS, Cosmos DB and SQL, Monitor, RBAC, pricing and more,
  using your own Azure sign-in.
homepage: https://github.com/microsoft/mcp
transport:
  type: stdio
  command: npx
  args: ["-y", "@azure/mcp@3.0.0-beta.50", "server", "start"]
auth:
  type: none
routing:
  examples:
    - "show me all my Azure resource groups"
    - "list the blobs in my Azure storage container"
    - "query my Log Analytics workspace for errors"
    - "what is the value of a key in Azure App Configuration"
  tools:
    group: ["list the resources inside this resource group", "show all my resource groups", "what resources are inside the rg-prod resource group"]
    storage: ["list storage accounts and blob containers", "list blobs in a container of my storage account", "show the tables in the storage account"]
    keyvault: ["fetch the secrets stored in my key vault", "add a new secret to the key vault", "list the certificates and keys in my vault"]
    monitor: ["run a kusto query on the logs from the last hour", "check CPU metrics for my VM over the last day", "query the Log Analytics workspace for errors"]
    cosmos: ["show my cosmos db databases", "list the containers in a Cosmos DB database", "query documents in my Cosmos account"]
    subscription: ["which Azure subscriptions do I have access to", "list my subscriptions and their ids"]
    appservice: ["show the app settings for my web app", "check deployment diagnostics for my App Service site"]
    functionapp: ["list my function apps", "which serverless functions do I have deployed"]
    aks: ["list my AKS clusters", "show the Kubernetes clusters in this subscription"]
    acr: ["list my container registries", "which Azure container registry holds my images"]
    compute: ["show my virtual machines and their sizes", "get details on a VM scale set or managed disk"]
    sql: ["list databases on my SQL server", "show firewall rules and elastic pools for my Azure SQL server"]
    postgres: ["list my PostgreSQL flexible servers", "show the tables in a Postgres database on Azure"]
    mysql: ["list my MySQL servers and databases", "show tables of a database on Azure Database for MySQL"]
    redis: ["list my Azure Cache for Redis instances", "create a Managed Redis resource in a resource group"]
    applicationinsights: ["list my Application Insights resources", "which app insights instances track my web app"]
    appconfig: ["show feature flags in my App Configuration store", "update a key-value setting in the config store"]
    eventhubs: ["list the event hubs in my namespace", "show Azure Event Hubs namespaces for this subscription"]
    servicebus: ["peek at messages in the dead-letter queue", "list the topics and subscriptions on my Service Bus namespace"]
    eventgrid: ["list my Event Grid topics", "show event subscriptions for a topic"]
    search: ["query a search index in my AI Search service", "list the indexes on my Azure AI Search service"]
    foundry: ["list the model deployments in my Foundry project", "show endpoints for my Foundry models"]
    kusto: ["run a KQL query on my Data Explorer cluster", "list databases and tables in an ADX cluster"]
    role: ["who has Contributor access on this resource group", "list role assignments for a user"]
    policy: ["which policy assignments apply to this subscription", "list Azure Policy definitions and initiatives"]
    pricing: ["how much does a Standard_D4s_v5 VM cost in West Europe", "estimate monthly cost for this SKU and region"]
    advisor: ["show Advisor recommendations for cost and security", "what does Azure suggest to improve my resources"]
    resourcehealth: ["is my VM currently available or degraded", "show service health events affecting my resources"]
    quota: ["how many vCPUs can I still use in this region", "check my quota limits for the subscription"]
    deploy: ["deploy this ARM template to a resource group", "run my deployment script against Azure"]
    bicepschema: ["what properties does a Microsoft.Storage storageAccount Bicep resource take", "get the Bicep schema for this resource type"]
    azureterraform: ["find an Azure Verified Module for a virtual network", "export my existing resources to Terraform", "look up azurerm provider docs for a resource"]
    cloudarchitect: ["help me design a highly available web app architecture", "ask me questions then recommend a cloud solution"]
    wellarchitectedframework: ["what are the reliability best practices for this service", "give me Well-Architected guidance on cost optimization"]
    workbooks: ["create a workbook that charts request failures", "list and edit my Azure Workbooks"]
    grafana: ["list my Managed Grafana workspaces", "which Grafana instances exist in this resource group"]
    loadtesting: ["start a load test against my API", "show results of my last Azure Load Testing run"]
    signalr: ["list my SignalR services", "show the runtime settings of a SignalR resource"]
    communication: ["send an SMS to this phone number", "email a customer using Communication Services"]
    marketplace: ["find marketplace offers for a firewall appliance", "browse Azure Marketplace products from a given publisher"]
    extension: ["what az command creates a resource group", "how do I install the Azure Developer CLI"]
health:
  check: initialize
