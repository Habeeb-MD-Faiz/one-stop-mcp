# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://developers.figma.com/docs/figma-mcp-server/remote-server-installation/ and
#   https://developers.figma.com/docs/figma-mcp-server/tools-and-prompts/ (official, hosted by Figma).
# Remote URL https://mcp.figma.com/mcp , OAuth sign-in (no API token mentioned). 36 tools from the tools page; the
#   live server also exposes a few more (for example export_video). Parameters are listed only where documented.
#   NOT VERIFIED: dynamic client registration; MCP auth discovery is assumed.
id: figma
name: Figma
category: [design, dev]
tags: [official, remote]
description: >
  Read Figma designs as code context, screenshots and variables, push UI and assets into Figma and
  FigJam, generate diagrams, and manage Code Connect mappings and design-system search.
homepage: https://developers.figma.com/docs/figma-mcp-server/
transport:
  type: streamable-http
  url: https://mcp.figma.com/mcp
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "turn this figma frame into react code"
    - "take a screenshot of the selected figma layer"
    - "create a flowchart in figjam"
    - "what design tokens does this screen use"
  tools:
    get_design_context: ["implement this figma design in my codebase", "generate React and Tailwind code from the selected frame", "what are the layout and spacing details of this component in the design"]
    get_screenshot: ["show me what that node looks like", "grab a picture of this component for reference", "render the current selection as an image"]
    generate_diagram: ["draw a sequence diagram of the login flow in figjam", "turn this mermaid code into a FigJam flowchart", "make a diagram of the checkout process from my description"]
    search_design_system: ["find the button component in our library", "search our design system for the date picker and its tokens", "is there a spacing variable called space-4 in the libraries"]
    get_metadata: ["give me an outline of the layers on this page", "list the top-level pages in my file"]
    download_assets: ["export these icons as SVG", "download the original images from these nodes"]
    get_variable_defs: ["what color and spacing variables does this frame use", "list the design tokens and text styles in my selection"]
    get_motion_context: ["get the animation keyframes for this prototype node", "give me code for the transition on this layer"]
    get_figjam: ["read the sticky notes on this FigJam board", "convert this whiteboard to text with screenshots"]
    use_figma: ["add a rounded button frame to the page", "rename these layers and change their fill color", "delete the old frame from my design file"]
    generate_figma_design: ["send this running web page into Figma as editable layers", "capture my localhost app screen into a design file"]
    create_new_file: ["create a blank FigJam board in my drafts", "make a new design file for the onboarding flow"]
    upload_assets: ["put this PNG into my design file", "upload these product photos into the Figma file"]
    generate_image: ["generate an image of a mountain at sunset", "create a hero illustration from this prompt"]
    get_libraries: ["which design libraries are available to my team", "list the libraries this file subscribes to"]
    get_code_connect_map: ["which code components are mapped to these nodes", "show the Code Connect mapping for this button"]
    add_code_connect_map: ["link this button in Figma to our Button.tsx component", "map the selected node to a code component"]
    get_code_connect_suggestions: ["suggest which design components match our code components", "auto-suggest Code Connect mappings for this file"]
    get_context_for_code_connect: ["get the properties needed to write a Code Connect template", "what variants and props does this component expose for connecting"]
    send_code_connect_mappings: ["confirm the suggested Code Connect mappings", "save the mappings you just proposed"]
    list_generative_plugins: ["list my generative plugins", "which AI plugins are in my account library"]
    get_generative_plugin: ["show the source manifest of my generative plugin", "read the code of plugin id 123"]
    create_generative_plugin: ["scaffold a new generative plugin called Palette Maker", "start a generative plugin that makes random avatars"]
    update_generative_plugin: ["replace the ui.html of my plugin and deploy it", "push new code.ts to my generative plugin"]
    list_shaders: ["list the shader effects in my library", "what shader fills do I have"]
    get_shader: ["show the source of this shader", "read the main.ts of my gradient shader"]
    create_shader: ["scaffold a new shader effect for noise fills", "create a blank shader for a glow effect"]
    update_shader: ["update my shader's main.ts and publish a new version", "change the shader code to animate the gradient"]
    list_file_shaders: ["which shaders are used in this file", "list the shader effects applied in this design"]
    whoami: ["which Figma account am I logged in as", "what plan and seat type do I have"]
    weave_list_tools: ["what Weave tools can I run", "search the Weave tools for background removal"]
    weave_get_tool_inputs: ["what inputs does this Weave tool need", "show the input contract for that Weave recipe"]
    weave_upload_asset: ["upload this image so a Weave tool can use it", "get a hosted URL for my attachment to feed into Weave"]
    weave_run_tool: ["run the upscale Weave tool on this image three times", "start a Weave run and confirm the cost first"]
    weave_get_tool_run_output: ["is my Weave run finished and what did it output", "fetch the results of those tool runs"]
    weave_cancel_tool_run: ["cancel the Weave run that is still going", "stop these tool runs"]
health:
  check: initialize
