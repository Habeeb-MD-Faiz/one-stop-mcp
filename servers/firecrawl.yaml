# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/firecrawl/firecrawl-mcp-server and https://docs.firecrawl.dev/mcp-server
# (official, Firecrawl). Hosted endpoint https://mcp.firecrawl.dev/v2/mcp with the key sent as
# `Authorization: Bearer <key>` (never in the URL); an OAuth variant exists at /v2/mcp-oauth.
# Stdio alternative: `env FIRECRAWL_API_KEY=... npx -y firecrawl-mcp` (npm firecrawl-mcp 3.29.1).
# The README lists 28 tools; all are in the snapshot. Parameter detail is documented only for
# scrape/search/crawl/map, so the rest keep open schemas.
id: firecrawl
name: Firecrawl
category: [web, search]
tags: [official, remote]
description: >
  Scrape, crawl, map and search the web with Firecrawl, extract structured data with an
  async research agent, interact with pages, parse files and monitor pages for changes.
homepage: https://docs.firecrawl.dev/mcp-server
transport:
  type: streamable-http
  url: https://mcp.firecrawl.dev/v2/mcp
auth:
  type: api_key
  header: Authorization
  prefix: "Bearer "
  keyUrl: https://www.firecrawl.dev/app/api-keys
routing:
  examples:
    - "scrape this web page into markdown"
    - "crawl an entire website and collect its pages"
    - "extract structured data from these urls"
    - "find all the urls on a site"
  tools:
    firecrawl_scrape: ["pull the main content off this article", "convert this product page to clean markdown", "extract the pricing table from this URL as JSON"]
    firecrawl_crawl: ["crawl the docs site up to 50 pages", "crawl my competitor's blog and pull every article", "spider this site but skip the /careers paths"]
    firecrawl_map: ["list every page url under this domain", "discover all the URLs on this website before I crawl it", "find the sitemap links for example.com"]
    firecrawl_search: ["search the web and return the page contents", "google this topic and give me the full text of the top results", "search for recent news on solar storage and scrape each hit"]
    firecrawl_agent: ["research this question and return structured json", "go gather the founders and funding of these companies as a JSON table", "start a background research job and return structured results"]
    firecrawl_search_feedback: ["tell Firecrawl that one of those search results was irrelevant", "report a bad search result"]
    firecrawl_feedback: ["leave feedback on the crawl job that just finished", "report that the last scrape job gave poor output"]
    firecrawl_check_crawl_status: ["is my crawl job finished yet", "check how many pages the crawl has processed"]
    firecrawl_parse: ["turn this PDF file into plain text", "parse the uploaded document and give me its text"]
    firecrawl_agent_status: ["is my research agent done, show me what it found", "fetch the results of the agent job I started"]
    firecrawl_interact: ["open this page, click the Load more button, then read the page", "type into the search box on this site and press enter"]
    firecrawl_interact_stop: ["close the interactive browser session", "end my interact session"]
    firecrawl_research_search_papers: ["find academic papers about retrieval augmented generation", "search paper abstracts on diffusion models"]
    firecrawl_research_inspect_paper: ["get the authors, year and venue for this paper ID", "show the metadata of one research paper"]
    firecrawl_research_related_papers: ["find papers that cite this one", "expand outward from these papers through their citations"]
    firecrawl_research_read_paper: ["read the methods section of this paper", "pull the full-text passages from this research paper"]
    firecrawl_monitor_create: ["watch this pricing page and alert me when it changes", "set up a daily check on a competitor's landing page"]
    firecrawl_monitor_list: ["show all the page monitors I have set up", "which pages am I currently watching for changes"]
    firecrawl_monitor_get: ["show the settings of one of my page monitors", "get the details and schedule of this monitor"]
    firecrawl_monitor_update: ["change how often my page monitor checks", "edit the URL a monitor is watching"]
    firecrawl_monitor_run: ["check that watched page for changes right now", "trigger my monitor immediately instead of waiting for the schedule"]
    firecrawl_monitor_delete: ["stop watching that page and delete the monitor", "remove a page monitor I no longer need"]
    firecrawl_monitor_checks: ["list the recent checks my monitor ran", "show only the failed checks for this monitor"]
    firecrawl_monitor_check: ["show me what changed on the watched page in the latest check", "get the diff from one monitor check"]
    firecrawl_developer_search: ["search GitHub issues and READMEs for this error message", "find pull requests and docs about a library's breaking change"]
    firecrawl_gov_search: ["search US federal regulations about data retention", "find government legal sources on this compliance topic"]
    firecrawl_find_tools: ["browse the catalogue of data providers I can use", "which Alexandria providers are available"]
    firecrawl_credit_usage: ["how many Firecrawl credits have I used this month", "show my remaining credit balance"]
health:
  check: initialize
