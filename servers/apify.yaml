# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://github.com/apify/apify-mcp-server (official, Apify). Hosted Streamable HTTP
# endpoint https://mcp.apify.com (the /sse endpoint was removed). OAuth works from the URL alone for
# clients such as Claude.ai and VS Code; `Authorization: Bearer <APIFY_TOKEN>` also works.
# Stdio alternative: `npx @apify/actors-mcp-server` with APIFY_TOKEN (npm 0.17.4).
# The README lists 39 tools; all are in the snapshot. It gives names and one-line descriptions only,
# so input schemas are left open.
id: apify
name: Apify
category: [web, data]
tags: [official, remote]
description: >
  Apify's MCP server. Find and run Actors from the Apify Store for web scraping and automation,
  read their datasets and run logs, manage tasks and schedules, and search the Apify docs.
homepage: https://github.com/apify/apify-mcp-server
transport:
  type: streamable-http
  url: https://mcp.apify.com
auth:
  type: oauth2
routing:
  examples:
    - "find an Apify actor that scrapes instagram"
    - "run a web scraper and get the results"
    - "scrape google maps listings for restaurants"
    - "check the status of my last Apify run"
  tools:
    search-actors: ["look in the Apify store for a tiktok scraper", "find a ready-made scraper for amazon product pages", "which actors exist for pulling linkedin company data"]
    call-actor: ["start this actor with these inputs and return its output", "run the instagram scraper on these profile URLs and wait for the data"]
    get-dataset-items: ["download the rows the scraper collected", "pull the first 100 items from this dataset", "fetch scraped results filtered by field with pagination"]
    get-actor-run-log: ["show the logs from that actor run", "why did my scraper run crash, show its console output", "print the log of the finished run"]
    create-schedule: ["run this scraper every morning at 8", "schedule this actor every Monday at midnight UTC", "create a recurring trigger for my saved task"]
    fetch-actor-details: ["show me the input fields and pricing for this actor", "read the README and output schema of the google maps scraper"]
    get-actor-run: ["what is the status of my actor run", "show the stats and finish time of run abc123"]
    get-key-value-store-record: ["read the INPUT record from my key-value store", "get the value saved under this key in the store"]
    abort-actor-run: ["stop the actor run that is still going", "cancel my running scraper but let it shut down gracefully"]
    delete-actor: ["permanently delete this actor from my account", "remove the old actor I no longer use"]
    search-apify-docs: ["look up how proxies work in the docs", "search the documentation for how to set actor memory limits"]
    fetch-apify-docs: ["open this docs page and give me its text", "read the documentation page at this URL"]
    apify--rag-web-browser: ["google this topic and return the page contents as markdown", "browse the web for the latest news on this and give me clean text"]
    apify--web-fetch: ["fetch this URL through the web fetch actor", "grab the content of this web page for me"]
    report-problem: ["this actor keeps failing, report the problem to Apify", "file a bug report about a scraper returning wrong data"]
    get-actor-list: ["list all the actors in my account", "show my private and shared actors"]
    get-actor-run-list: ["show the recent runs of this actor that failed", "list my runs filtered by status"]
    get-dataset: ["how many items are in this dataset", "show the metadata of dataset xyz"]
    get-dataset-schema: ["infer a JSON schema from the dataset items", "what fields does this scraped dataset contain"]
    get-key-value-store: ["show info about this key-value store", "when was my store created and how big is it"]
    get-key-value-store-keys: ["list all keys saved in this key-value store", "which records are in my store"]
    get-dataset-list: ["list all my datasets", "show the datasets stored in my account"]
    get-key-value-store-list: ["list my key-value stores", "show every store in my account"]
    create-actor-task: ["save this actor with these inputs as a reusable task", "create a task for the amazon scraper with preset input"]
    get-actor-task: ["show the saved task and whether it is published", "get the settings of my task"]
    update-actor-task: ["change the input of my saved task", "update the memory and timeout of this task"]
    publish-actor-task: ["publish this task on its public landing page", "make my task available to others through a landing page"]
    unpublish-actor-task: ["take this task off its landing page", "unpublish the task so it is private again"]
    get-schedule: ["show the cron expression of my schedule", "is my schedule enabled and what does it run"]
    update-schedule: ["change my schedule to run hourly instead", "pause the schedule and switch its time zone"]
    delete-schedule: ["delete the nightly schedule", "remove this schedule so it stops running"]
    get-actor-build: ["did the actor build succeed", "check the status of my latest build"]
    get-actor-build-log: ["show the build log of my actor", "why did the build fail, print the build output"]
    get-actor-build-list: ["list the builds of this actor", "show all recent builds in my account"]
    build-actor: ["build the latest version of my actor and wait for it", "compile my actor and tell me when it is done"]
    get-actor-version: ["show the source files of this actor version", "read main.js from the latest actor version"]
    apify-api-search: ["find the API endpoint for listing webhooks", "search the API reference for the operation that creates a dataset"]
    apify-api-details: ["show the request schema for this API path", "what parameters does the runs endpoint accept"]
    apify-api-read: ["call a GET endpoint on the Apify API for me", "read the response of this API path directly"]
health:
  check: initialize
