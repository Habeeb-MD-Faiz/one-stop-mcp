# yaml-language-server: $schema=../schema/manifest.schema.json
# Source: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/getting-started-with-the-atlassian-remote-mcp-server/
#   (official, hosted by Atlassian, "Atlassian Rovo MCP server"). Server URL https://mcp.atlassian.com/v2/mcp;
#   the page says appending ?tools=all exposes every tool as a flat paginated list and recommends it for MCP
#   gateways (the default is a discover/execute pattern plus primary tools), so it is used here.
# Tools: https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/ (full list is several
#   hundred across Jira, Confluence, Bitbucket, Loom, Goals, Assets...). The snapshot keeps 40 Jira and Confluence
#   tools. Descriptions are condensed from that page; most parameters are not documented (a few are best-effort).
# Auth: OAuth 2.1 (primary); an API token is also possible (header format not given on the page).
# NOT VERIFIED: dynamic client registration / client metadata support; MCP auth discovery is assumed.
id: atlassian
name: Atlassian (Jira and Confluence)
category: [productivity, docs, dev]
tags: [official, remote]
description: >
  Search, read, create and edit Jira work items, sprints and boards and Confluence pages, spaces and
  comments in the connected Atlassian sites.
homepage: https://support.atlassian.com/atlassian-rovo-mcp-server/
transport:
  type: streamable-http
  url: https://mcp.atlassian.com/v2/mcp?tools=all
auth:
  type: oauth2
  scopes: []
routing:
  examples:
    - "create a jira ticket for this bug"
    - "search confluence for the architecture doc"
    - "move my jira issue to in progress"
    - "what's in the current sprint"
  tools:
    searchJiraIssuesUsingJql: ["find open bugs assigned to me in jira", "run a JQL query for tickets in the current sprint", "list unresolved issues updated in the last week"]
    createJiraIssue: ["open a new story in the PLAT project", "file a bug in the WEB project with this summary", "create a task under epic PLAT-10"]
    transitionJiraIssue: ["set PROJ-42 to done", "move this ticket to In Review", "put PROJ-9 into the active sprint"]
    searchConfluence: ["look up the onboarding runbook in confluence", "find the pages in the ENG space about deploy process", "run a CQL search for pages I edited this month"]
    atlassianUserInfo: ["who am I signed in as on Atlassian", "show my account id and email address"]
    getAccessibleAtlassianResources: ["which Atlassian sites can I reach", "find my cloudId for the company site"]
    search: ["search Jira and Confluence for the onboarding checklist", "find anything about the payments outage across our docs and tickets"]
    getJiraIssue: ["show me the details of PROJ-123", "read the description and status of this ticket"]
    editJiraIssue: ["change the assignee and priority on PROJ-77", "update the summary and labels of this ticket"]
    addOrEditJiraIssueComment: ["comment on PROJ-15 that the fix is deployed", "edit my earlier comment on this ticket"]
    listJiraIssueComments: ["what has been said on PROJ-88", "show the comment thread of this ticket"]
    listJiraIssueTransitions: ["what statuses can PROJ-5 move to next", "show the workflow steps available for this work item"]
    listJiraProjects: ["which Jira projects can I see", "list all project spaces and their keys"]
    listJiraProjectIssueTypesMetadata: ["what issue types does the WEB project support", "list the story, bug and epic types in this space"]
    getJiraIssueTypeMetaWithFields: ["what fields are required to create a bug here", "show the field metadata for the Story type"]
    lookupJiraAccountId: ["find the account id for jane.doe@company.com", "look up Sam's user id so I can mention him"]
    listJiraIssueAssignableUsers: ["who can I assign PROJ-30 to", "list people eligible to take this ticket"]
    addOrEditJiraIssueWorklog: ["log 2 hours of work on PROJ-61", "record time spent on this ticket and fix my last entry"]
    listJiraIssueWorklogs: ["how much time has been logged on PROJ-61", "show the timesheet entries for this work item"]
    createJiraIssueLink: ["mark PROJ-1 as blocked by PROJ-2", "link these two tickets as duplicates"]
    listJiraIssueChangelogs: ["who changed the status of PROJ-14 and when", "show the field history of this ticket"]
    listJiraStatuses: ["what statuses exist on our Jira site", "list every workflow status I can filter by"]
    listJiraBoards: ["show my Scrum and Kanban boards", "which boards do I have access to"]
    getJiraBoardIssueData: ["show the backlog of the platform board", "get the issues on this board filtered by assignee"]
    listJiraBoardSprints: ["list the closed sprints of this board", "which sprints are active or upcoming for the team board"]
    getJiraBoardSprintData: ["what's in the current sprint", "show the work items in the active sprint of this board"]
    manageJiraSprint: ["start sprint 24 and add these tickets", "create a new sprint and close the finished one"]
    watchJiraIssue: ["add me as a watcher on PROJ-99", "stop notifying me about this ticket"]
    getConfluenceContent: ["open the Confluence page about incident response", "read this blog post or whiteboard by its id"]
    listConfluenceContent: ["list all pages in the Engineering space", "show the blog posts in this space"]
    createConfluenceContent: ["write a new page titled Release Notes in the docs space", "create a blog post announcing the launch"]
    updateConfluenceContent: ["edit the runbook page and add a rollback section", "revise the whiteboard I made yesterday"]
    listConfluenceSpaces: ["which Confluence spaces can I read", "list the team spaces on our wiki"]
    getConfluenceSpace: ["show details and homepage of the HR space", "what is the space key and description for Design"]
    listConfluenceComments: ["what feedback did people leave on this page", "show inline and footer comments on the doc"]
    createConfluenceComment: ["reply to the comment on the architecture page", "leave an inline comment on this paragraph"]
    moveConfluenceContent: ["move this page under the Handbook parent", "reorder the page so it sits first in its section"]
    copyConfluenceContent: ["duplicate the template page into another space", "copy this page beneath a new parent"]
    addLabelsToConfluenceContent: ["tag the page with onboarding and hr labels", "add a label to this document"]
    getTeamworkGraphContext: ["what tickets and pages are connected to this page", "show the people and work related to PROJ-40"]
health:
  check: initialize
